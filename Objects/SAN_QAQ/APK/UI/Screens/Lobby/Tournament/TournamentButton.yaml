Header:
    version: 157
ImportedPackages:
- "~res:/UI/Screens3/Lobby/Clan/ClanEmblem.yaml"
- "~res:/UI/Screens3/Common/BlurModified.yaml"
Prototypes:
-   class: "UIControl"
    name: "Button"
    size: [222.000000, 50.000000]
    classes: "button"
    components:
        Background:
            drawType: "DRAW_TILED_MULTILAYER"
            mask: "~res:/Gfx/UI/LobbyCommon/Button/white_mask"
            detail: "~res:/Gfx/UI/LobbyCommon/Button/white_detail"
            gradient: "~res:/Gfx/UI/LobbyCommon/Button/white_gradient"
            contour: "~res:/Gfx/UI/LobbyCommon/Button/white_contour"
            gradientMode: "Overlay"
            leftRightStretchCap: 20.000000
            topBottomStretchCap: 20.000000
        UIRoundedCornersComponent:
            radius: "4"
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "FixedSize"
            verticalValue: 50.000000
        Sound: {}
        UIDataParamsComponent:
            params:
            - ["bool", "isBlur", "true", "true"]
        StyleSheet:
            styles: "~res:/UI/Screens3/ButtonSound.style.yaml;~res:/UI/Screens/Fonts.yaml;~res:/UI/Styles/ButtonStyle.yaml"
    children:
    -   prototype: "BlurModified/BlurModified"
        name: "Blur"
        components:
            UIDataParamsComponent:
                args:
                    "isBlur": "isBlur"
                    "roundCorner": "\"4\""
    -   class: "UIStaticText"
        name: "Caption"
        size: [222.000000, 51.000000]
        classes: "header3 text-color-white"
        components:
            Anchor:
                leftAnchorEnabled: true
                rightAnchorEnabled: true
                topAnchorEnabled: true
                topAnchor: -1.000000
                bottomAnchorEnabled: true
            UITextComponent:
                text: "Header1"
                colorInheritType: "COLOR_MULTIPLY_ALPHA_ONLY"
