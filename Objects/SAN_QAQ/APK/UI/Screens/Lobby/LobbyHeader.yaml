                    verticalPolicy: "PercentOfParent"
            children:
            -   class: "UIControl"
                name: "labels"
                input: false
                components:
                    LinearLayout:
                        orientation: "TopDown"
                        dynamicPadding: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        verticalPolicy: "PercentOfParent"
                children:
                -   prototype: "HeaderLabel"
                    name: "primaryLabel"
                    classes: "header1"
                -   prototype: "HeaderLabel"
                    name: "secondaryLabel"
                    classes: "text1 text-color-white"
            -   class: "UIControl"
                name: "userInfo"
                size: [928.000000, 64.000000]
