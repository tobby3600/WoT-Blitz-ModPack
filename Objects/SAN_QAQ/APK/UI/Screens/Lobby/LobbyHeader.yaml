Header:
    version: 155
ImportedPackages:
- "~res:/UI/Screens/Common/StyledMenuButton.yaml"
- "~res:/UI/Screens/Common/IconButton.yaml"
- "~res:/UI/Screens3/Common/BlurModified.yaml"
Prototypes:
-   class: "UIControl"
    name: "HeaderBase"
    position: [0.000000, 0.000000]
    size: [1024.000000, 80.000000]
    input: false
    components:
        Anchor:
            topAnchorEnabled: true
        Background:
            drawType: "DRAW_ALIGNED"
            leftRightStretchCap: 2.000000
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "FixedSize"
            verticalValue: 80.000000
        StyleSheet:
            styles: "~res:/UI/Screens/Lobby/LobbyHeader.style.yaml"
    children:
    -   class: "UIControl"
        name: "bg"
        position: [0.000000, 0.000000]
        size: [1024.000000, 80.000000]
        input: false
        components:
            Anchor:
                leftAnchorEnabled: true
                leftAnchor: 0.000000
                rightAnchorEnabled: true
                rightAnchor: 0.000000
                topAnchorEnabled: true
                topAnchor: 0.000000
        children:
        -   prototype: "BlurModified/BlurModified"
            name: "Blur"
            components:
                UIDataParamsComponent:
                    args:
                        "bgStyle": "\"grey-shark-70-bg\""
    -   prototype: "StyledMenuButton/StyledMenuButton"
        name: "menuButton"
        children:
        -   path: "icon"
            components:
                Background:
                    sprite: "~res:/Gfx/UI/LobbyCommon/IconsSmall.psd"
        -   path: "UnreadNews"
            classes: "header3 bg-color=unread-icon-bg state=hide-unread-icon no-general-pack-hidden"
            components:
                StyleSheet:
                    styles: "~res:/UI/Screens/Common/Styles/UnreadIcon.style.yaml;~res:/UI/Screens/Fonts.yaml;~res:/UI/Screens3/SmartDLC.style.yaml"
    -   class: "UIControl"
        name: "Layout"
        input: false
        components:
            Anchor:
                leftAnchorEnabled: true
                leftAnchor: 96.000000
                rightAnchorEnabled: true
                topAnchorEnabled: true
                bottomAnchorEnabled: true
            LinearLayout: {}
            UIAnchorSafeAreaComponent:
                leftSafeInset: "INSET"
                rightSafeInset: "INSET"
    -   class: "UIControl"
        name: "Line"
        size: [1024.000000, 1.000000]
        input: false
        classes: "header-line"
        components:
            Background: {}
            Anchor:
                leftAnchorEnabled: true
                rightAnchorEnabled: true
                bottomAnchorEnabled: true
            StyleSheet:
                styles: "~res:/UI/Screens3/Background.style.yaml"
-   class: "UIStaticText"
    name: "HeaderLabel"
    components:
        Background:
            drawType: "DRAW_ALIGNED"
            align: ["LEFT", "TOP"]
        UITextComponent:
            text: "label"
            fitting: "FITTING_REDUCE"
            align: ["LEFT", "VCENTER"]
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfContent"
        StyleSheet:
            styles: "~res:/UI/Screens/Fonts.yaml"
-   prototype: "HeaderBase"
    name: "Header"
    components:
        StyleSheet:
            styles: "~res:/UI/Screens/Lobby/LobbyHeader.style.yaml;~res:/UI/Screens/Fonts.yaml;~res:/UI/Screens3/NetEase.style.yaml"
    children:
    -   path: "menuButton"
        components:
            UIAttachLayoutMasterComponent:
                attachId: "MAIN_MENU_BUTTON"
        children: []
    -   path: "Layout"
        position: [96.000000, 0.000000]
        children:
        -   class: "UIControl"
            name: "leftContent"
            position: [0.000000, 0.000000]
            size: [928.000000, 80.000000]
            input: false
