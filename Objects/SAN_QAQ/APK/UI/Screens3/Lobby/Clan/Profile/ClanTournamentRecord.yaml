Header:
    version: 153
Prototypes:
-   class: "UIControl"
    name: "ClanTournamentRecord"
    size: [600.000000, 64.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "FixedSize"
            verticalValue: 64.000000
        UIDataParamsComponent:
            params:
            - ["Clan", "clan", "null", "{ }"]
            - ["ClanTournamentRecord", "record", "null", "{ }"]
            events:
            - "ON_CLICK_RECORD"
    children:
    -   class: "UIControl"
        name: "Content"
        pivot: [0.500000, 0.500000]
        classes: "white-wild-sand-15-bg hoverable touchable-self button-open-sound"
        components:
            Background: {}
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            LinearLayout:
                padding: "20;20"
                dynamicSpacing: true
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
            UIInputEventComponent:
                onTouchUpInside: "ON_CLICK_RECORD"
            Sound: {}
            StyleSheet:
                styles: "~res:/UI/Screens3/Color.style.yaml;~res:/UI/Screens3/Common/Touch.style.yaml;~res:/UI/Screens3/Common/Hover.style.yaml;~res:/UI/Screens3/ButtonSound.style.yaml"
        children:
        -   class: "UIControl"
            name: "TeamInfo"
            input: false
            components:
                Anchor:
                    leftAnchorEnabled: true
                    vCenterAnchorEnabled: true
                LinearLayout:
                    padding: "-5; 0"
                SizePolicy:
                    horizontalPolicy: "FixedSize"
                    horizontalValue: 200.000000
                    verticalPolicy: "PercentOfMaxChild"
            children:
            -   class: "UIControl"
                name: "Emblem"
                input: false
                components:
                    Background:
                        drawType: "DRAW_SCALE_PROPORTIONAL_ONE"
                    UIOpacityComponent: {}
                    UIUrlImageComponent: {}
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 40.000000
                        verticalPolicy: "FixedSize"
                        verticalValue: 40.000000
                bindings:
                - ["UIUrlImageComponent.imageUrl", "clan.emblem.url"]
            -   class: "UIControl"
                name: "Name"
                input: false
                components:
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfMaxChild"
                        verticalPolicy: "PercentOfMaxChild"
                    UIChildComponent0:
                        prototypePath: "~res:/UI/Screens3/Lobby/Clan/Common/ClanNameWithTag.yaml"
                        args:
                            "fontStyle": "\"t-overline bold\""
                            "tag": "when not isNull(clan) -> clan.tag, \"\""
                            "name": "when not isNull(record.team) -> record.team.title, \"\""
        -   class: "UIControl"
            name: "TournamentName"
            input: false
            classes: "t-overline bold color=white-wild-sand-text"
            components:
                UITextComponent:
                    colorInheritType: "COLOR_IGNORE_PARENT"
                    align: ["HCENTER", "VCENTER"]
                Anchor:
                    hCenterAnchorEnabled: true
                    vCenterAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "FixedSize"
                    horizontalValue: 220.000000
                    verticalPolicy: "PercentOfContent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
            bindings:
            - ["UITextComponent.text", "record.tournamentName"]
        -   class: "UIControl"
            name: "TournamentDate"
            input: false
            classes: "t-overline bold color=white-wild-sand-text"
            components:
                UITextComponent:
                    colorInheritType: "COLOR_IGNORE_PARENT"
                    align: ["RIGHT", "VCENTER"]
                Anchor:
                    rightAnchorEnabled: true
                    vCenterAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "FixedSize"
                    horizontalValue: 130.000000
                    verticalPolicy: "PercentOfContent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
            bindings:
            - ["UITextComponent.text", "date(record.tournamentDate)"]
