Header:
    version: 151
ImportedPackages:
- "~res:/UI/Screens3/Lobby/Common/Button.yaml"
- "~res:/UI/Screens3/Lobby/Clan/Common/ClanNameWithTag.yaml"
Prototypes:
-   class: "UIControl"
    name: "ClanCreate"
    size: [800.000000, 600.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfParent"
        UILayoutEventComponent:
            sizeChangedEvent: "SIZE_CHANGED"
            sizeChangedEventData: "int(_size.X)"
            visibilityMarginsEvent: "KEYBOARD_EVENT"
            visibilityMarginsEventData: "_visibilityMargins.bottom"
        UIVirtualActionEventComponent0:
            virtualKeyAction: "Escape"
            keyDownEvent: "ON_PREV"
        UIVirtualActionEventComponent1:
            virtualKeyAction: "Perform"
        UIDataParamsComponent:
            params:
            - ["AppDataModel", "app", "null", "{ }"]
            - ["SessionDataModel", "session", "null", "{ }"]
            - ["bool", "isDebugAnimations", "false", "true"]
            - ["ClanCreateModel", "model", "null", "{ }"]
            - ["ClanRecruitmentModel", "recruitmentModel", "null", "{ }"]
            events:
            - "SELECT_EMBLEM(int id)"
        UIDataLocalVarsComponent:
            data:
            - ["int", "stepIndex", "int(model.step)"]
            - ["int", "screenWidth", "1440"]
            - ["float", "keyboardHeight", "0.000000"]
            - ["float", "blurOpacity", "when model.step == eClanCreateStep.ClanIntro -> 0.000000, 1.000000"]
            - ["float", "fadeOpacity", "when model.step == eClanCreateStep.ClanIntro -> 0.000000, 0.300000"]
            - ["float", "buttonsOffset", "0.000000"]
            - ["float", "contentOffset", "0.000000"]
            - ["float", "contentOpacity", "1.000000"]
            - ["float", "animationHalfTime", "0.400000"]
        UIDataLocalBindingsComponent:
            data:
            - ["bool", "isChina", "app.netease.neteaseAvailable"]
            - ["int", "notificationCount", "when app.gameOptions.playerOption.enableClanInvites -> session.clanNotifications.invitesCount + session.clanNotifications.unreadNotifications, session.clanNotifications.unreadNotifications"]
        UIChildComponent0:
            prototypePath: "~res:/UI/Screens3/Lobby/Clan/Common/ClanBaseScreen.yaml"
            args:
                "headerText": "when model.step == eClanCreateStep.Recruitment -> \"Clans/RecruitmentOverlay/Title\", \"Clans/Create/ScreenHeader\""
                "backVisible": "model.step != eClanCreateStep.Recruitment and (isDebugAnimations or model.step != eClanCreateStep.Congratulation)"
                "blurOpacity": "blurOpacity"
                "fadeOpacity": "fadeOpacity"
                "headerOpacity": "when keyboardHeight > 200.000000 -> 0.000000, keyboardHeight > 1.000000 -> (200.000000 - keyboardHeight) / 200.000000, blurOpacity < 0.500000 -> 0.000000, (blurOpacity - 0.500000) * 2.000000"
                "content": "MainContent"
                "isBlurMask": "when blurOpacity == 0.000000"
                "blurMaskID": "\"Create\""
            eventActions:
            - ["ON_BACK_CLICK", "ON_PREV", ""]
        UIActionComponent:
            actionsPath: "~res:/UI/Screens3/Lobby/Clan/Create/ClanCreate.actions"
        UIDataOnEventComponent0:
            eventName: "SIZE_CHANGED"
            modelFieldExpression: "screenWidth"
            dataExpression: "_event"
        UIEventOnDataComponent0:
            watchedDataExpression: "model.step"
            eventName: "OnStepChangedFromCode"
Slots:
-   class: "UIControl"
    name: "MainContent"
    size: [800.000000, 600.000000]
    input: false
    components:
        ClipContent:
            enabled: false
            top: false
        LinearLayout:
            orientation: "TopDown"
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfParent"
    children:
    -   class: "UIControl"
        name: "ActiveContent"
        input: false
        components:
            UIOpacityComponent: {}
            Anchor:
                hCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
            UIChildComponent0:
                childType: "kControl"
                condition: "session.clanInfo.lastClanApiError == eClanApiError.InternalServerError or session.clanInfo.lastClanApiError == eClanApiError.ExternalServerError or session.clanInfo.lastClanApiError == eClanApiError.ServerOnMaintenance"
                control: "CreationUnavailableContent"
            UIChildComponent1:
                childType: "kControl"
                control: "when stepIndex == int(eClanCreateStep.ClanIntro) -> IntroContent, stepIndex == int(eClanCreateStep.CreateClan) -> CreateContent, stepIndex == int(eClanCreateStep.CreateInfo) -> InfoContent, stepIndex == int(eClanCreateStep.Congratulation) -> CongratulationContent, stepIndex == int(eClanCreateStep.Recruitment) -> RecruitmentContent, stepIndex == int(eClanCreateStep.CreationUnavaible) -> CreationUnavailableContent, null"
        bindings:
        - ["UIOpacityComponent.opacity", "contentOpacity"]
        - ["Anchor.hCenterAnchor", "contentOffset"]
