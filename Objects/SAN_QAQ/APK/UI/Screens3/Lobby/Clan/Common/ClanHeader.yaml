Header:
    version: 151
ImportedPackages:
- "~res:/UI/Screens3/Common/BlurModified.yaml"
Prototypes:
-   class: "UIControl"
    name: "ClanHeader"
    size: [600.000000, 72.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "FixedSize"
            verticalValue: 72.000000
        UIDataParamsComponent:
            params:
            - ["bool", "backVisible", "true", "true"]
            - ["float", "headerOpacity", "1.000000", "1.000000"]
            - ["string", "headerText", "\"\"", "\"#Заголовок\""]
            events:
            - "BACK_EVENT"
    children:
    -   prototype: "BlurModified/BlurModified"
        name: "Blur"
    -   class: "UIControl"
        name: "Back"
        input: false
        components:
            Anchor:
                leftAnchorEnabled: true
                leftAnchor: 16.000000
                vCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfFirstChild"
            UIChildComponent0:
                condition: "backVisible"
                prototypePath: "~res:/UI/Screens3/Lobby/Common/IconButton.yaml"
                args:
                    "image": "\"~res:/Gfx/Lobby/icons/icon_arrow-back\""
                    "type": "eButtonType.OPTIONAL_LIGHT"
                    "sound": "eButtonSound.CLOSE"
                    "locked": "false"
                    "visible": "true"
                    "isBgVisible": "false"
                    "enabled": "true"
                eventActions:
                - ["ON_CLICK_BUTTON", "BACK_EVENT", ""]
        bindings:
        - ["visible", "backVisible"]
    -   class: "UIControl"
        name: "HeadLineRegular"
        input: false
        classes: "t-headline regular color=white-wild-sand-text"
        components:
            UIOpacityComponent: {}
            UITextComponent:
                colorInheritType: "COLOR_IGNORE_PARENT"
                align: ["LEFT", "VCENTER"]
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "PercentOfContent"
                verticalPolicy: "PercentOfContent"
            StyleSheet:
                styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
        bindings:
        - ["UIOpacityComponent.opacity", "headerOpacity"]
        - ["UITextComponent.text", "localize(headerText)"]
