Header:
    version: 161
Prototypes:
-   class: "UIControl"
    name: "ShopSectionItem"
    input: false
    components:
        Anchor:
            hCenterAnchorEnabled: true
        SizePolicy:
            horizontalPolicy: "PercentOfLastChild"
            verticalPolicy: "PercentOfLastChild"
        UIDataParamsComponent:
            params:
            - ["bool", "isChina", "false", "false"]
            - ["int", "itemsLimit", "0", "10"]
            - ["int", "itemIndex", "0", "0"]
            - ["vector2", "groupSpacer", "vec2(0, 0)", "vec2(0, 0)"]
            - ["int", "sectionWidth", "0", "0"]
            - ["ShopGroup", "group", "null", "{ }"]
            - ["ShopBadgesSection", "badges", "null", "{ }"]
            - ["bool", "initializationEnded", "false", "true"]
            - ["bool", "isAtLeastMediumDevice", "false", "true"]
            - ["float", "shopScrollBottomOffset", "0.000000", "40.000000"]
            - ["int", "itemsInLine", "3", "3"]
            - ["float", "shopScrollTopOffset", "0.000000", "48.000000"]
            - ["SessionDataModel", "session", "null", "{ }"]
            - ["bool", "arabicLocalization", "false", "false"]
            - ["bool", "debugMode", "false", "false"]
            - ["bool", "selected", "false", "true"]
            - ["int", "selectedSubItemIndex", "0", "0"]
            - ["DailyChestsCommonData", "dailyChestsCommon", "null", "{ }"]
            - ["bool", "validItem", "true", "true"]
            - ["ShopSectionItem", "item", "null", "{ }"]
            - ["bool", "firstShowAnimationAllowed", "false", "true"]
            - ["set<int>", "newSliders", "null", "[ 0; ]"]
            events:
            - "ON_LOAD_PRODUCTS"
            - "PIGGY_BANK_STAGE_PROGRESS(int stuffDescr)"
            - "PIGGY_BANK_SAVE_PROGRESS(int stuffDescr)"
            - "ON_AD_SHOWN(ePlaySite playSite)"
            - "ON_AD_CLICKED(ePlaySite playSite)"
            - "ON_SELECT_PRODUCT(int itemIndex)"
            - "ON_CHEST_CLICKED(int id)"
            - "ON_PRODUCT_CLICKED(int id)"
            - "ON_CHAIN_CLICKED(int id)"
            - "ON_SLIDER_CLICKED(int productId, int sliderId)"
            - "SHOW_BUYOUT_TANKS"
            - "DEV_BUY_PRODUCT(int id)"
            - "GO_TO_GROUP(int id)"
            - "GO_TO_PRODUCT(int id)"
            - "ON_PRODUCT_SHOWN(int id)"
            - "ON_SLIDER_SHOWN(int id)"
            - "ON_CAMO_CLICKED(int id)"
            - "ON_CAMO_PRODUCT_SHOWN(int id)"
    bindings:
    - ["visible", "validItem and (itemsLimit == 0 or itemIndex <= itemsLimit - 1)"]
    children:
    -   class: "UIControl"
        name: "MaskedArea"
        input: false
        components:
            IgnoreLayout: {}
            Anchor:
                hCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
            UIChildComponent0:
                condition: "not isNull(group)"
                prototypePath: "~res:/UI/Screens3/Lobby/Shop/Group/ShopGroup.yaml"
                args:
                    "serverTime": "session.serverTime"
                    "spacerSize": "groupSpacer"
                    "itemsInLine": "itemsInLine"
                    "startIndex": "item.trueIndex % itemsInLine"
                    "sectionWidth": "sectionWidth"
                    "group": "group"
                    "debugMode": "debugMode"
                eventActions:
                - ["GO_TO_GROUP", "GO_TO_GROUP", "_event.id"]
    -   class: "UIControl"
        name: "SectionItem"
        input: false
        components:
            Anchor:
                hCenterAnchorEnabled: true
                bottomAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfFirstChild"
            UIChildComponent0:
                childType: "kControl"
                condition: "itemsLimit > 0 and itemIndex == itemsLimit - 1"
                control: "LoadMore"
            UIChildComponent1:
                childType: "kControl"
                condition: "item.size == ShopProductSize.GroupWithTitle and (itemsLimit == 0 or itemIndex < itemsLimit - 1)"
                control: "GroupWithTitleShopSectionItem"
            UIChildComponent2:
                childType: "kControl"
                condition: "itemsLimit == 0 or itemIndex < itemsLimit - 1"
                control: "StandartSectionItem"
Slots:
-   class: "UIControl"
    name: "StandartSectionItem"
    input: false
    components:
        Anchor:
            hCenterAnchorEnabled: true
        SizePolicy:
            horizontalPolicy: "PercentOfFirstChild"
            verticalPolicy: "PercentOfFirstChild"
        UIChildAnimatedSwitchingComponent:
            switchPolicy: "kAfterRemovingAnimation"
        UIChildComponent0:
            condition: "validItem and not isNull(item.slider) and not isNull(item.slider.mainProduct) and item.slider.imageSize == eShopProductImageSize.Double"
            prototypePath: "~res:/UI/Screens3/Lobby/Shop/ShopDoubleProduct.yaml"
            args:
                "maxDiscount": "item.slider.maxDiscount"
                "isNewBigSlider": "newSliders.Contains(item.slider.id)"
                "isBigSlider": "true"
                "arabicLocalization": "arabicLocalization"
                "badge": "when not isNull(badges) and badges.products.Contains(item.slider.mainProduct.id) -> badges.products[item.slider.mainProduct.id], null"
                "isAtLeastMediumDevice": "isAtLeastMediumDevice"
                "debugMode": "debugMode"
                "firstShowAnimationAllowed": "firstShowAnimationAllowed"
                "horizontalSpacer": "int(groupSpacer.X)"
                "initializationEnded": "initializationEnded"
                "product": "item.slider.mainProduct"
                "selected": "selected"
                "serverTime": "session.serverTime"
                "shopScrollBottomOffset": "shopScrollBottomOffset"
                "shopScrollTopOffset": "shopScrollTopOffset"
            eventActions:
            - ["ON_PRODUCT_CLICKED", "ON_SLIDER_CLICKED", "_event.id, item.slider.id"]
            - ["DEV_BUY_PRODUCT", "DEV_BUY_PRODUCT", "_event.id"]
            - ["GO_TO_PRODUCT", "GO_TO_PRODUCT", "_event.id"]
            - ["ON_SLIDER_SHOWN", "ON_SLIDER_SHOWN", "item.slider.id"]
