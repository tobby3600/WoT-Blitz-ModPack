                "debugMode": "debugMode"
                "firstShowAnimationAllowed": "firstShowAnimationAllowed and newSliders.Contains(item.slider.id)"
                "horizontalSpacer": "int(groupSpacer.X)"
                "initializationEnded": "initializationEnded"
                "product": "item.slider.mainProduct"
