Header:
    version: 125
Prototypes:
-   class: "UIControl"
    name: "BlurDynamicLite"
    input: false
    components:
        Background:
            usePostProcessedSprite: true
        UIPostProcessTextureComponent0:
            materialPath: "~res:/Materials/2d.Textured.material"
            useVirtualCoordinateSystem: true
            minFilter: "Linear"
            magFilter: "Linear"
        UIPostProcessTextureComponent1:
            materialPath: "~res:/Materials.custom/2d.Textured.BlurLite.material"
            needClearAlphaAfterRender: true
            needDepth: true
            scale: 0.250000
            useVirtualCoordinateSystem: true
            minFilter: "Linear"
            magFilter: "Linear"
        UIPostProcessTextureComponent2:
            materialPath: "~res:/Materials.custom/2d.Textured.HBlurLite.material"
            scale: 0.250000
            useVirtualCoordinateSystem: true
            minFilter: "Linear"
            magFilter: "Linear"
        UIPostProcessTextureComponent3:
            materialPath: "~res:/Materials.custom/2d.Textured.UpscaleClamp.material"
            scale: 0.250000
            useVirtualCoordinateSystem: true
            minFilter: "Linear"
            magFilter: "Linear"
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfParent"
