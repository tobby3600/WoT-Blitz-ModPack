Header:
    version: 157
ImportedPackages:
- "~res:/UI/Screens3/Common/BlurModified.yaml"
Prototypes:
-   class: "UIControl"
    name: "Header"
    size: [960.000000, 48.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "FixedSize"
            verticalValue: 48.000000
        UIDataParamsComponent:
            params:
            - ["bool", "isBlur", "true", "true"]
            - ["bool", "isFullScreen", "false", "true"]
            - ["bool", "needSafeArea", "true", "true"]
            - ["control", "background", "null", "null"]
            - ["control", "content", "null", "null"]
            - ["string", "bgStyle", "\"\"", "\"\""]
            events: []
    children:
    -   class: "UIControl"
        name: "Background"
        input: false
        components:
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
            UIChildComponent0:
                childType: "kControl"
                condition: "isNull(background)"
                control: "DefaultBg"
            UIChildComponent1:
                childType: "kControl"
                condition: "not isNull(background)"
                control: "background"
            StyleSheet:
                styles: "~res:/UI/Screens3/Color.style.yaml"
    -   class: "UIControl"
        name: "Layout"
        input: false
        components:
            LinearLayout: {}
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
        children:
        -   class: "UIControl"
            name: "LeftSafeArea"
            input: false
            components:
                SizePolicy:
                    horizontalPolicy: "PercentOfFirstChild"
                    verticalPolicy: "PercentOfParent"
                UIChildComponent0:
                    childType: "kPrototype"
                    condition: "isFullScreen and needSafeArea"
                    prototypePath: "~res:/UI/Screens3/Lobby/Common/Sidebar/SideBarSafeArea.yaml"
            bindings:
            - ["visible", "isFullScreen and needSafeArea"]
        -   class: "UIControl"
            name: "Content"
            input: false
            components:
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
                UIChildComponent0:
                    childType: "kControl"
                    condition: "not isNull(content)"
                    control: "content"
        -   class: "UIControl"
            name: "RightSafeArea"
            input: false
            components:
                SizePolicy:
                    horizontalPolicy: "Formula"
                    horizontalFormula: "max(safeAreaInsets.right, 8)"
                    verticalPolicy: "PercentOfParent"
            bindings:
            - ["visible", "needSafeArea"]
Slots:
-   prototype: "BlurModified/BlurModified"
    name: "DefaultBg"
    components:
        UIDataParamsComponent:
            args:
                "isBlur": "isBlur"
                "bgStyle": "bgStyle"
