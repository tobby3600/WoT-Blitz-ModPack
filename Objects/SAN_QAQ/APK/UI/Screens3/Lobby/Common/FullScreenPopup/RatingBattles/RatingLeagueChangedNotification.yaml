Header:
    version: 157
ImportedPackages:
- "~res:/UI/Screens3/Lobby/Common/FullScreenPopup/FullscreenPopupWithContentSlot.yaml"
- "~res:/UI/Screens3/Lobby/Common/Button.yaml"
Prototypes:
-   class: "UIControl"
    name: "RatingLeagueChangedNotification"
    size: [960.000000, 640.000000]
    components:
        UIAnimationComponent:
            animations: "_INIT,~res:/UI/Screens3/Lobby/Common/FullScreenPopup/RatingBattles/RatingLeagueChangedNotification.animation"
        Anchor:
            leftAnchorEnabled: true
            rightAnchorEnabled: true
            topAnchorEnabled: true
            bottomAnchorEnabled: true
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfParent"
        UIDataParamsComponent:
            params:
            - ["string", "startDate", "\"\"", "\"05.02\""]
            - ["string", "endDate", "\"\"", "\"31.02\""]
            - ["RatingBattleModel", "rating", "null", "{ }"]
            events:
            - "CLOSE_NOTIFICATION"
        UIDataLocalVarsComponent:
            data:
            - ["string", "title", "localize(\"ratingBattles/leagueChanged/Title\")"]
            - ["eLeague", "league", "rating.leagueType"]
            - ["string", "leagueColorTextStyle", "when league == eLeague.NO_LEAGUE -> \"white-wild-sand-50-text\", league == eLeague.BRONZE -> \"yellow-chalky-text\", league == eLeague.SILVER -> \"blue-rimmi-text\", league == eLeague.GOLD -> \"yellow-lightning-text\", league == eLeague.PLATINUM -> \"orange-tango-text\", league == eLeague.DIAMOND -> \"purple-chupretto-text\", \"\""]
            - ["string", "leagueStyle", "when league == eLeague.NO_LEAGUE -> \"t-content-h2 regular \" + leagueColorTextStyle, \"t-content-h2 bold \" + leagueColorTextStyle"]
            - ["string", "description", "localize(\"ratingBattles/leagueChanged/Description\")"]
            - ["string", "leagueName", "localize(\"ratingBattles/leagueName/\" + str(league, eLeague, \"lower_case\"))"]
            - ["int", "prevLeagueNumber", "int(league - 1)"]
            - ["eLeague", "prevLeague", "toEnum(prevLeagueNumber, eLeague)"]
            - ["eLeague", "currentLeague", "prevLeague"]
        UIDataLocalBindingsComponent:
            data:
            - ["int", "bottomAnchorDistance", "(screenHeight / 10) * 2 - 16"]
            - ["int", "anchorDistance", "when screenHeight >= 1080 -> 48, 16"]
        UIActionComponent:
            actionsPath: "~res:/UI/Screens3/Lobby/Common/FullScreenPopup/RatingBattles/RatingLeagueChangedNotification.actions"
    children:
    -   prototype: "FullscreenPopupWithContentSlot/FullscreenPopupWithContentSlot"
        name: "FullscreenPopupWithContentSlot"
        components:
            UIDataParamsComponent:
                args:
                    "customBg": "Background"
                    "isButtonVisible": "false"
                    "disableInput": "false"
                    "contentControl": "Description"
                eventActions:
                - ["CLOSE_NOTIFICATION", "CLOSE_NOTIFICATION", ""]
                - ["ACCENT_CLICKED", "ENTER_SHORTCUT", ""]
                - ["SwitchDebugMode", "", ""]
        children:
        -   path: "Content/Content"
            position: [16.000000, 16.000000]
        -   path: "Content/CloseButton/IconButtonLight/TapArea/Content/RoundedProgressBar"
            bindings:
            - ["visible", "isRoundedProgressBar"]
        -   path: "Content/CloseButton/IconButtonLight/TapArea/Content/BadgeHolder"
            bindings:
            - ["visible", "isBadgeVisible"]
