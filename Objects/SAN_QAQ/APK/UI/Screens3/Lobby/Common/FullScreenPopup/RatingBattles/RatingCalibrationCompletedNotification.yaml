            params:
            - ["string", "startDate", "\"\"", "\"05.02\""]
            - ["string", "endDate", "\"\"", "\"31.02\""]
            - ["RatingBattleModel", "rating", "{ }", "{ }"]
            events:
            - "CLOSE_NOTIFICATION"
        UIDataLocalVarsComponent:
            data:
            - ["eLeague", "league", "rating.leagueType"]
            - ["map<string,string>", "nextLeague", "{ \"NO_LEAGUE\" = \"BRONZE\"; \"BRONZE\" = \"SILVER\"; \"SILVER\" = \"GOLD\"; \"GOLD\" = \"PLATINUM\"; \"PLATINUM\" = \"DIAMOND\"; \"DIAMOND\" = \"NO_LEAGUE\"; }"]
            - ["map<string,int>", "leagueStartRating", "{ \"NO_LEAGUE\" = 0; \"BRONZE\" = 0; \"SILVER\" = 2000; \"GOLD\" = 3000; \"PLATINUM\" = 4000; \"DIAMOND\" = 5000; }"]
            - ["map<string,string>", "leagueDescriptions", "{ \"NO_LEAGUE\" = \"ratingBattles/calibrationCompleted/no_league\"; \"BRONZE\" = \"ratingBattles/leagueName/bronze\"; \"SILVER\" = \"ratingBattles/leagueName/silver\"; \"GOLD\" = \"ratingBattles/leagueName/gold\"; \"PLATINUM\" = \"ratingBattles/leagueName/platinum\"; \"DIAMOND\" = \"ratingBattles/leagueName/diamond\"; }"]
            - ["bool", "hasNextLeague", "league < eLeague.DIAMOND"]
            - ["int", "currentLeagueStartRating", "leagueStartRating[str(league, eLeague)]"]
            - ["int", "nextLeagueStartRating", "when hasNextLeague -> leagueStartRating[nextLeague[str(league, eLeague)]], 6000"]
            - ["string", "title", "localize(\"ratingBattles/calibrationDone/Title\")"]
            - ["string", "description", "localize(\"ratingBattles/calibrationDone/Description\")"]
            - ["float", "currentProgressWidth", "float(((rating.currentRating - currentLeagueStartRating) * 100 / (nextLeagueStartRating - currentLeagueStartRating)))"]
            - ["int", "nextLeagueNumber", "int(league + 1)"]
            - ["eLeague", "nextLeagueName", "when hasNextLeague -> toEnum(nextLeagueNumber, eLeague), eLeague.NO_LEAGUE"]
            - ["float", "progressWidth", "0.000000"]
            - ["int", "currentRating", "rating.currentRating"]
            - ["int", "displayedRating", "currentLeagueStartRating"]
            - ["string", "leagueName", "leagueDescriptions[str(league, eLeague)]"]
            - ["bool", "showProgressFX", "false"]
        UIDataLocalBindingsComponent:
            data:
            - ["int", "bottomAnchorDistance", "(screenHeight / 10) * 2 - 16"]
            - ["int", "anchorDistance", "when screenHeight >= 1080 -> 48, 16"]
        UIActionComponent:
            actionsPath: "~res:/UI/Screens3/Lobby/Common/FullScreenPopup/RatingBattles/RatingCalibrationCompletedNotification.actions"
    children:
    -   prototype: "FullscreenPopupWithContentSlot/FullscreenPopupWithContentSlot"
        name: "FullscreenPopupWithContentSlot"
        components:
            UIDataParamsComponent:
