Header:
    version: 161
Prototypes:
-   class: "UIControl"
    name: "Value"
    input: false
    components:
        RichContent:
            baseClasses: "t-body regular white-wild-sand-70-text"
        RichContentAliases0:
            aliases:
            - ["text_white_bold", "<span class=\"t-body bold white-wild-sand-text\" />"]
            - ["text2_white_bold", "<span class=\"t-body bold white-wild-sand-text\" />"]
        Anchor:
            leftAnchorEnabled: true
        FlowLayout:
            hSpacing: 5.000000
            useRtl: true
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfChildrenSum"
        UIDataParamsComponent:
            params:
            - ["bool", "alginLeft", "false", "false"]
            - ["string", "contentText", "\"\"", "\"Его многочисленные, убого тонкие по сравнению с остальным телом ножки беспомощно копошились у него перед глазами. «Что со мной случилось?\""]
        StyleSheet:
            styles: "~res:/UI/Screens3/Color.style.yaml;~res:/UI/Screens3/Font.style.yaml"
    bindings:
    - ["RichContent.text", "localize(contentText, { \"highlight_start\" = \"<text_white_bold>\"; \"highlight_end\" = \"</text_white_bold>\"; })"]
    - ["FlowLayout.alignment", "when alginLeft -> Left, Center"]
    - ["FlowLayout.hDynamicPadding", "when alginLeft -> false, true"]
