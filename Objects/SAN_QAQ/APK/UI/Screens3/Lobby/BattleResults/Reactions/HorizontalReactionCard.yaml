Header:
    version: 155
Prototypes:
-   class: "UIControl"
    name: "HorizontalReactionCard"
    input: false
    refreshStylesOnInteract: false
    components:
        UIOpacityComponent: {}
        SizePolicy:
            horizontalPolicy: "PercentOfLastChild"
            verticalPolicy: "FixedSize"
            verticalValue: 28.000000
        UIAttachLayoutMasterComponent: {}
        UISystemEventComponent:
            onActivated: "HorizontalReactionCardInit"
        UIDataParamsComponent:
            params:
            - ["bool", "hasUpdate", "false", "false"]
            - ["bool", "isNotAllowedReactionsAnimation", "false", "false"]
            - ["bool", "blocked", "false", "false"]
            - ["int", "masterId", "0", "0"]
            - ["int", "index", "0", "0"]
            - ["string", "icon", "\"\"", "\"\""]
            - ["bool", "timeExpired", "false", "false"]
            - ["bool", "isAccontSetReaction", "false", "false"]
            - ["int", "value", "0", "2"]
            - ["bool", "isLocatedInHeader", "false", "false"]
            events:
            - "ShowAccountReaction"
            - "ShowReactionsPopup"
            - "ShowReactionLimitPopup"
        UIDataLocalVarsComponent:
            data:
            - ["int", "defaultBgWidth", "when value > 0 -> 49, 28"]
            - ["int", "contentSpacing", "when value == 0 -> 0, isAccontSetReaction -> -14, 4"]
            - ["int", "valueOpacity", "when value > 0 -> 1, 0"]
            - ["int", "localValue", "value"]
        UIDataLocalBindingsComponent:
            data:
            - ["float", "defoultBgOpacity", "when value > 0 -> 0.150000, 0.000000"]
            - ["float", "cardOpacity", "when timeExpired -> 0.500000, 1.000000"]
            - ["color", "valueColor", "when isAccontSetReaction -> hsb(43, 85, 100), hsb(0, 0, 96)"]
        UIActionComponent:
            actionsPath: "~res:/UI/Screens3/Lobby/BattleResults/Reactions/HorizontalReactionCard.actions"
        UIEventOnDataComponent0:
            watchedDataExpression: "value"
            eventName: "ValueChanged"
    bindings:
    - ["UIOpacityComponent.opacity", "when timeExpired and not isLocatedInHeader -> 0.500000, 1"]
    - ["UIAttachLayoutMasterComponent.attachId", "when isLocatedInHeader -> \"accountReactionPopup\" + str(index), \"reactionLimitPopup\" + str(masterId)"]
    children:
    -   class: "UIControl"
        name: "TapArea"
        components:
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "FixedSize"
                horizontalValue: 68.000000
                verticalPolicy: "FixedSize"
                verticalValue: 56.000000
            UIInputEventComponent:
                onTouchDown: "OnTouchDown"
                onTouchUpInside: "OnTouchUpInside"
                onTouchUpOutside: "OnTouchUpOutside"
                onInputCanceled: "OnTouchUpOutside"
                onHoverSet: "OnHoverStart"
                onHoverRemoved: "OnHoverEnd"
        bindings:
        - ["input", "not blocked"]
    -   class: "UIControl"
        name: "ContentWrapper"
        scale: [1.000000, 1.000000]
        pivot: [0.500000, 0.500000]
        input: false
        components:
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            LinearLayout: {}
            SizePolicy:
                horizontalPolicy: "PercentOfLastChild"
                verticalPolicy: "FixedSize"
                verticalValue: 28.000000
        bindings:
        - ["LinearLayout.padding", "when isAccontSetReaction or isLocatedInHeader -> 0, 4"]
        children:
        -   class: "UIControl"
            name: "Content"
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                    vCenterAnchorEnabled: true
                LinearLayout: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfChildrenSum"
                    verticalPolicy: "FixedSize"
                    verticalValue: 28.000000
            bindings:
            - ["LinearLayout.spacing", "contentSpacing"]
            children:
            -   class: "UIControl"
                name: "DefaultBg"
                scale: [1.000000, 1.000000]
                pivot: [0.500000, 0.500000]
                input: false
                components:
                    Background:
                        drawType: "DRAW_STRETCH_BOTH"
                        sprite: "~res:/Gfx/Lobby/backgrounds/bg_ninepatch_r28"
                        color: [0.960784, 0.960784, 0.960784, 1.000000]
                        leftRightStretchCap: 14.000000
                    UIOpacityComponent: {}
                    Anchor:
                        leftAnchorEnabled: true
                        leftAnchor: -4.000000
                    IgnoreLayout: {}
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        verticalPolicy: "FixedSize"
                        verticalValue: 28.000000
                bindings:
                - ["visible", "not isAccontSetReaction and not isLocatedInHeader and value > 0"]
                - ["UIOpacityComponent.opacity", "when value > 0 -> 0.150000, 0.000000"]
                - ["SizePolicy.horizontalValue", "defaultBgWidth"]
            -   class: "UIControl"
                name: "RoundBg"
                scale: [1.000000, 1.000000]
                pivot: [0.500000, 0.500000]
                input: false
                components:
                    Background:
                        drawType: "DRAW_FILL"
                        color: [0.960784, 0.960784, 0.960784, 1.000000]
                        perPixelAccuracy: "PER_PIXEL_ACCURACY_ENABLED"
                    UIOpacityComponent:
                        opacity: 0.000000
                    UIRoundedCornersComponent:
                        radius: "50"
                    Anchor:
                        hCenterAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    IgnoreLayout: {}
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 32.000000
                        verticalPolicy: "FixedSize"
                        verticalValue: 32.000000
                bindings:
                - ["visible", "not isAccontSetReaction and not isLocatedInHeader and value == 0"]
            -   class: "UIControl"
                name: "DefoultIcon"
                input: false
                components:
                    Background:
                        drawType: "DRAW_ALIGNED"
                        sprite: "~res:/Gfx/Lobby/icons/icon_reaction_m"
                        perPixelAccuracy: "PER_PIXEL_ACCURACY_ENABLED"
                    UIGradientComponent:
                        orientation: "LeftToRight"
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 20.000000
                        verticalPolicy: "FixedSize"
                        verticalValue: 20.000000
                bindings:
                - ["visible", "not isLocatedInHeader"]
                - ["UIGradientComponent.startColor", "rgba(245, 245, 245, 0.750000)"]
                - ["UIGradientComponent.finishColor", "when isAccontSetReaction -> rgba(245, 245, 245, 0), rgba(245, 245, 245, 0.750000)"]
            -   class: "UIControl"
                name: "ReactionGroup"
                input: false
                components:
                    LinearLayout:
                        spacing: -7.000000
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        verticalPolicy: "FixedSize"
                        verticalValue: 28.000000
                bindings:
                - ["SizePolicy.horizontalValue", "when isAccontSetReaction or isLocatedInHeader -> 54, (value > 0 and not isAccontSetReaction) -> 17, 0"]
                children:
                -   class: "UIControl"
                    name: "GradientHover"
                    input: false
                    components:
                        UIOpacityComponent:
                            opacity: 0.000000
                        Anchor:
                            rightAnchorEnabled: true
                        LinearLayout: {}
                        IgnoreLayout: {}
                        SizePolicy:
                            horizontalPolicy: "FixedSize"
                            verticalPolicy: "FixedSize"
                            verticalValue: 28.000000
                    bindings:
                    - ["visible", "isAccontSetReaction or isLocatedInHeader"]
                    - ["SizePolicy.horizontalValue", "when value > 0 -> 40, 0"]
                    children:
                    -   class: "UIControl"
                        name: "Rectangle"
                        input: false
                        components:
                            Background:
                                drawType: "DRAW_FILL"
                            UIGradientComponent:
                                orientation: "RightToLeft"
                            SizePolicy:
                                horizontalPolicy: "PercentOfParent"
                                verticalPolicy: "PercentOfParent"
                        bindings:
                        - ["UIGradientComponent.startColor", "rgba(245, 245, 245, 0.200000)"]
                        - ["UIGradientComponent.finishColor", "rgba(245, 245, 245, 0)"]
                    -   class: "UIControl"
                        name: "HalfOval"
                        input: false
                        components:
                            Background:
                                drawType: "DRAW_SCALE_PROPORTIONAL"
                                sprite: "~res:/Gfx/Lobby/backgrounds/bg_half-oval_40"
                                spriteModification: ["FLIP_HORIZONTAL"]
                            UIGradientComponent:
                                orientation: "LeftToRight"
                            SizePolicy:
                                horizontalPolicy: "FixedSize"
                                horizontalValue: 14.000000
                                verticalPolicy: "PercentOfParent"
                        bindings:
                        - ["UIGradientComponent.startColor", "rgba(245, 245, 245, 0.300000)"]
                        - ["UIGradientComponent.finishColor", "rgba(245, 245, 245, 0.200000)"]
                -   class: "UIControl"
                    name: "GradientBgWrapper"
                    input: false
                    components:
                        Anchor:
                            rightAnchorEnabled: true
                        LinearLayout:
                            orientation: "LeftToRight"
                        IgnoreLayout: {}
                        SizePolicy:
                            horizontalPolicy: "FixedSize"
                            verticalPolicy: "FixedSize"
                            verticalValue: 28.000000
                    bindings:
                    - ["visible", "isAccontSetReaction or isLocatedInHeader"]
                    - ["SizePolicy.horizontalValue", "when value > 0 -> 40, 0"]
                    children:
                    -   class: "UIControl"
                        name: "Rectangle"
                        input: false
                        components:
                            Background:
                                drawType: "DRAW_FILL"
                            UIGradientComponent:
                                orientation: "RightToLeft"
                            SizePolicy:
                                horizontalPolicy: "PercentOfParent"
                                verticalPolicy: "PercentOfParent"
                        bindings:
                        - ["UIGradientComponent.startColor", "when isLocatedInHeader -> rgba(245, 245, 245, 0.100000), rgba(255, 194, 38, 0.300000)"]
                        - ["UIGradientComponent.finishColor", "when isLocatedInHeader -> rgba(245, 245, 245, 0), rgba(255, 194, 38, 0)"]
                    -   class: "UIControl"
                        name: "HalfOval"
                        input: false
                        components:
                            Background:
                                drawType: "DRAW_SCALE_PROPORTIONAL"
                                sprite: "~res:/Gfx/Lobby/backgrounds/bg_half-oval_40"
                                spriteModification: ["FLIP_HORIZONTAL"]
                            UIGradientComponent:
                                orientation: "LeftToRight"
                            SizePolicy:
                                horizontalPolicy: "FixedSize"
                                horizontalValue: 14.000000
                                verticalPolicy: "PercentOfParent"
                        bindings:
                        - ["UIGradientComponent.startColor", "when isLocatedInHeader -> rgba(245, 245, 245, 0.150000), rgba(255, 194, 38, 0.500000)"]
                        - ["UIGradientComponent.finishColor", "when isLocatedInHeader -> rgba(245, 245, 245, 0.100000), rgba(255, 194, 38, 0.300000)"]
                -   class: "UIControl"
                    name: "ReactionIconWrapper"
                    input: false
                    components:
                        Anchor:
                            vCenterAnchorEnabled: true
                        SizePolicy:
                            horizontalPolicy: "FixedSize"
                            horizontalValue: 40.000000
                            verticalPolicy: "FixedSize"
                            verticalValue: 40.000000
                    bindings:
                    - ["visible", "isAccontSetReaction or isLocatedInHeader"]
                    children:
                    -   class: "UIControl"
                        name: "ReactionIconHolder"
                        scale: [1.000000, 1.000000]
                        pivot: [0.500000, 0.500000]
                        input: false
                        components:
                            Anchor:
                                hCenterAnchorEnabled: true
                                vCenterAnchorEnabled: true
                            SizePolicy:
                                horizontalPolicy: "FixedSize"
                                horizontalValue: 40.000000
                                verticalPolicy: "FixedSize"
                                verticalValue: 40.000000
                            UIChildComponent0:
                                prototypePath: "~res:/UI/Screens3/Lobby/BattleResults/Reactions/ReactionIcon.yaml"
                                args:
                                    "icon": "icon"
                                    "size": "40"
                -   class: "UIControl"
                    name: "ValueWrapper"
                    input: false
                    components:
                        UIOpacityComponent: {}
                        Anchor:
                            hCenterAnchorEnabled: true
                            vCenterAnchorEnabled: true
                        SizePolicy:
                            horizontalPolicy: "FixedSize"
                            horizontalValue: 17.000000
                            verticalPolicy: "FixedSize"
                            verticalValue: 20.000000
                    bindings:
                    - ["visible", "value > 0"]
                    - ["UIOpacityComponent.opacity", "valueOpacity"]
                    children:
                    -   class: "UIControl"
                        name: "Shadow"
                        input: false
                        components:
                            Background:
                                drawType: "DRAW_SCALE_TO_RECT"
                                sprite: "~res:/Gfx/Lobby/backgrounds/bg_radial-loading_shadow"
                            Anchor:
                                hCenterAnchorEnabled: true
                                vCenterAnchorEnabled: true
                            SizePolicy:
                                horizontalPolicy: "PercentOfParent"
                                horizontalValue: 160.000000
                                verticalPolicy: "PercentOfParent"
                                verticalValue: 160.000000
                    -   class: "UIControl"
                        name: "Value"
                        input: false
                        components:
                            UITextComponent:
                                fontPath: "~res:/Fonts/XinGothic-SC-W12.otf"
                                fontSize: 15.000000
                                ascendScale: 0.650000
                                descendScale: 0.750000
                                letterSpacing: 0.120000
                                colorInheritType: "COLOR_IGNORE_PARENT"
                            SizePolicy:
                                horizontalPolicy: "FixedSize"
                                horizontalValue: 17.000000
                                verticalPolicy: "FixedSize"
                                verticalValue: 20.000000
                        bindings:
                        - ["UITextComponent.text", "localValue"]
                        - ["UITextComponent.color", "valueColor"]