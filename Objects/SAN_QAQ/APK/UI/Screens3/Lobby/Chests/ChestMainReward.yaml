Header:
    version: 150
ImportedPackages:
- "~res:/UI/Screens3/Common/BlurModified.yaml"
Prototypes:
-   class: "UIControl"
    name: "MainReward"
    input: true
    classes: "battlepass-reward button-open-sound"
    components:
        SizePolicy:
            horizontalPolicy: "Formula"
            horizontalFormula: "max(maxChild, 168)"
            verticalPolicy: "FixedSize"
            verticalValue: 43.000000
        UIInputEventComponent:
            onTouchUpInside: "ON_MAIN_REWARD_CLICKED"
        UIDataParamsComponent:
            params:
            - ["ResourceProgress", "progress", "null", "{ }"]
            events:
            - "ON_MAIN_REWARD_CLICKED"
        Sound: {}
        StyleSheet:
            styles: "~res:/UI/Screens3/Common/Touch.style.yaml;~res:/UI/Screens3/Color.style.yaml;~res:/UI/Screens3/ButtonSound.style.yaml"
    children:
    -   class: "UIControl"
        name: "Content"
        pivot: [0.500000, 0.500000]
        input: false
        classes: "content-area"
        components:
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            LinearLayout:
                orientation: "TopDown"
            SizePolicy:
                horizontalPolicy: "Formula"
                horizontalFormula: "max(firstChild, 168) * 1.15"
                verticalPolicy: "Formula"
                verticalFormula: "(parent + lastChild) * 1.05"
        children:
        -   prototype: "BlurModified/BlurModified"
            name: "Blur"
            components:
                UIDataParamsComponent:
                    args:
                        "bgStyle": "\"white-wild-sand-25-bg\""
                        "roundCorner": "\"4\""
        -   class: "UIControl"
            name: "label"
            input: false
            components:
                LinearLayout:
                    padding: "0; 8"
                SizePolicy:
                    horizontalPolicy: "PercentOfChildrenSum"
                    verticalPolicy: "PercentOfParent"
            children:
            -   class: "UIControl"
                name: "icon"
                size: [32.000000, 32.000000]
                input: false
                components:
                    UITextureComponent:
                        spritePath: "~res:/Gfx/Lobby/icons/icon_protection_s"
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 32.000000
                        verticalPolicy: "FixedSize"
                        verticalValue: 32.000000
            -   class: "UIControl"
                name: "text"
                input: false
                classes: "t-subtitle regular color=white-wild-sand-text"
                components:
                    UITextComponent:
                        colorInheritType: "COLOR_IGNORE_PARENT"
                        align: ["LEFT", "VCENTER"]
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfContent"
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
                bindings:
                - ["UITextComponent.text", "localize(\"storage/Items/Chest/MainReward\")"]
        -   class: "UIControl"
            name: "progress"
            input: false
            components:
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "FixedSize"
                    verticalValue: 4.000000
                UIChildComponent0:
                    prototypePath: "~res:/UI/Screens3/Lobby/Common/ProgressBar.yaml"
                    args:
                        "minimum": "progress.progress.minimum"
                        "maximum": "progress.progress.maximum"
                        "value": "progress.progress.value"
                        "bgStyle": "\"black-50-bg\""
                        "isBlur": "false"
