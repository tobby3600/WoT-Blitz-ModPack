Prototypes:
-   class: "UIControl"
    name: "RatingHistogram"
    size: [120.000000, 150.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "FixedSize"
            verticalValue: 188.000000
        UIDataParamsComponent:
            params:
            - ["int", "level", "0", "7"]
            - ["int", "delta", "0", "1026"]
            - ["float", "percent", "1.000000", "0.500000"]
            - ["eRatingHistogramStyle", "style", "eRatingHistogramStyle.NEUTRAL", "eRatingHistogramStyle.POSITIVE"]
        UIDataLocalBindingsComponent:
            data:
            - ["string", "colorStyle", "when style == eRatingHistogramStyle.POSITIVE -> \"green-la-palma-bg\", when style == eRatingHistogramStyle.NEGATIVE -> \"red-tamarillo-bg\", \"white-wild-sand-25-bg\""]
            - ["string", "colorStyleOpacity", "when style == eRatingHistogramStyle.POSITIVE -> \"green-la-palma-50-bg\", when style == eRatingHistogramStyle.NEGATIVE -> \"red-tamarillo-50-bg\", \"white-wild-sand-15-bg\""]
            - ["float", "histogramPercent", "abs(percent)"]
        StyleSheet:
            styles: "~res:/UI/Screens3/Color.style.yaml"
    children:
    # -   class: "UIControl"
        # name: "Background"
        # input: false
        # components:
            # Anchor: {}
            # IgnoreLayout: {}
            # SizePolicy:
                # horizontalPolicy: "PercentOfParent"
                # verticalPolicy: "FixedSize"
        # bindings:
        # - ["Anchor.topAnchorEnabled", "style != eRatingHistogramStyle.POSITIVE"]
        # - ["Anchor.topAnchor", "when style == eRatingHistogramStyle.NEGATIVE -> 120, 96"]
        # - ["Anchor.bottomAnchorEnabled", "style == eRatingHistogramStyle.POSITIVE"]
        # - ["Anchor.bottomAnchor", "when style == eRatingHistogramStyle.POSITIVE -> 92, 0"]
        # - ["SizePolicy.verticalValue", "when style == eRatingHistogramStyle.POSITIVE -> 68 * histogramPercent, when style == eRatingHistogramStyle.NEGATIVE -> 40 * histogramPercent, 24"]
        # children:
        # -   prototype: "BlurModified/BlurModified"
            # name: "Blur"
    -   class: "UIControl"
        name: "Top"
        input: false
        components:
            Anchor:
                bottomAnchorEnabled: true
                bottomAnchor: 92.000000
            LinearLayout:
                orientation: "TopDown"
                spacing: 8.000000
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfChildrenSum"
        bindings:
        - ["visible", "style == eRatingHistogramStyle.POSITIVE"]
        children:
        -   class: "UIControl"
            name: "Value"
            size: [32.000000, 32.000000]
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                LinearLayout:
                    spacing: 4.000000
                SizePolicy:
                    horizontalPolicy: "PercentOfChildrenSum"
                    verticalPolicy: "PercentOfLastChild"
            children:
            -   class: "UIControl"
                name: "Icon"
                size: [8.000000, 6.000000]
                input: false
                classes: "green-green-bg"
                components:
                    Background:
                        drawType: "DRAW_SCALE_PROPORTIONAL"
                        sprite: "~res:/Gfx/Lobby/backgrounds/bg_triangle_8.psd"
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 6.000000
                        verticalPolicy: "FixedSize"
                        verticalValue: 6.000000
                bindings:
                - ["visible", "style == eRatingHistogramStyle.POSITIVE"]
            -   class: "UIControl"
                name: "Text"
                input: false
                classes: "t-caption bold color=white-wild-sand-text not-localize"
                components:
                    UITextComponent: {}
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfContent"
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml"
                bindings:
                - ["UITextComponent.text", "str1000Separated(delta)"]
        -   class: "UIControl"
            name: "Bar"
            input: false
            components:
                Background: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "FixedSize"
            bindings:
            - ["classes", "colorStyleOpacity"]
            - ["SizePolicy.verticalValue", "68 * histogramPercent"]
    -   class: "UIControl"
        name: "Center"
        input: false
        components:
            Anchor:
                topAnchorEnabled: true
                topAnchor: 96.000000
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "FixedSize"
                verticalValue: 24.000000
        children:
        -   class: "UIControl"
            name: "Bg"
            size: [32.000000, 32.000000]
            input: false
            components:
                Background: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
            bindings:
            - ["classes", "colorStyle"]
        -   prototype: "VehicleLevel/VehicleLevel"
            name: "VehicleLevel"
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                UIDataParamsComponent:
                    args:
                        "level": "level"
                        "type": "eVehicleDescriptionType.NORMAL"
    -   class: "UIControl"
        name: "Bottom"
        input: false
        components:
            Anchor:
                topAnchorEnabled: true
                topAnchor: 120.000000
            LinearLayout:
                orientation: "TopDown"
                spacing: 8.000000
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfChildrenSum"
        bindings:
        - ["visible", "style == eRatingHistogramStyle.NEGATIVE"]
        children:
        -   class: "UIControl"
            name: "Bar"
            input: false
            components:
                Background: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "FixedSize"
            bindings:
            - ["classes", "colorStyleOpacity"]
            - ["SizePolicy.verticalValue", "40 * histogramPercent"]
        -   class: "UIControl"
            name: "Value"
            size: [32.000000, 32.000000]
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                LinearLayout:
                    spacing: 4.000000
                SizePolicy:
                    horizontalPolicy: "PercentOfChildrenSum"
                    verticalPolicy: "PercentOfLastChild"
            children:
            -   class: "UIControl"
                name: "Icon"
                size: [32.000000, 32.000000]
                input: false
                classes: "red-red-bg"
                components:
                    Background:
                        drawType: "DRAW_SCALE_PROPORTIONAL"
                        sprite: "~res:/Gfx/Lobby/backgrounds/bg_triangle_8.psd"
                        spriteModification: ["FLIP_VERTICAL"]
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 6.000000
                        verticalPolicy: "FixedSize"
                        verticalValue: 6.000000
                bindings:
                - ["visible", "style == eRatingHistogramStyle.NEGATIVE"]
            -   class: "UIControl"
                name: "Text"
                input: false
                classes: "t-caption bold color=white-wild-sand-text"
                components:
                    UITextComponent: {}
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfContent"
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml"
                bindings:
                - ["UITextComponent.text", "str1000Separated(abs(delta))"]
