Header:
    version: 149
Prototypes:
-   class: "UIControl"
    name: "ShortProfileTableCell"
    size: [400.000000, 41.000000]
    input: false
    components:
        LinearLayout:
            orientation: "TopDown"
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfChildrenSum"
        UIDataParamsComponent:
            params:
            - ["string", "titleStyle", "\"t-body regular white-wild-sand-text\"", "\"t-body regular white-wild-sand-50-text\""]
            - ["bool", "visible", "true", "true"]
            - ["string", "name", "\"#name\"", "\"#name\""]
            - ["string", "value", "\"#value\"", "\"#value\""]
            - ["bool", "showBottomSeparator", "false", "true"]
    bindings:
    - ["visible", "visible"]
    children:
    -   class: "UIControl"
        name: "MainParamWrapper"
        input: false
        components:
            LinearLayout:
                orientation: "TopDown"
                padding: "8"
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfMaxChild"
        children:
        -   class: "UIControl"
            name: "MainParam"
            position: [0.000000, 0.000000]
            input: false
            components:
                LinearLayout:
                    padding: "8"
                    spacing: 16.000000
                    dynamicSpacing: true
                    useRtl: true
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfMaxChild"
            children:
            -   class: "UIControl"
                name: "Title"
                input: false
                components:
                    UITextComponent:
                        multiline: "MULTILINE_ENABLED"
                        align: ["LEFT", "VCENTER"]
                    SizePolicy:
                        horizontalPolicy: "Formula"
                        horizontalFormula: "min(parentRest, content)"
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml"
                bindings:
                - ["classes", "titleStyle"]
                - ["UITextComponent.text", "name"]
            -   class: "UIControl"
                name: "Value"
                input: false
                classes: "t-body bold white-wild-sand-text"
                components:
                    UITextComponent: {}
                    Anchor:
                        topAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfContent"
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml"
                bindings:
                - ["UITextComponent.text", "value"]
    -   class: "UIControl"
        name: "Separator"
        input: false
        classes: "white-wild-sand-15-bg"
        components:
            Background: {}
            Anchor:
                bottomAnchorEnabled: true
            IgnoreLayout: {}
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "FixedSize"
                verticalValue: 1.000000
            StyleSheet:
                styles: "~res:/UI/Screens3/Color.style.yaml"
        bindings:
        - ["visible", "showBottomSeparator"]
