Header:
    version: 155
Prototypes:
-   class: "UIControl"
    name: "ProfilePlayerName"
    input: false
    classes: "profile-player-name"
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfChildrenSum"
            verticalPolicy: "PercentOfChildrenSum"
        UIDataParamsComponent:
            params:
            - ["string", "playerName", "\"\"", "\"Nickname\""]
            - ["string", "clanTag", "\"#WG\"", "\"#WG\""]
            - ["string", "clanName", "\"\"", "\"#Wargaming\""]
            events:
            - "ON_TOUCH_UP"
        UIIdentifierComponent:
            id: "profile_player_info"
            params:
            - ["string", "clan_tag", "clanTag"]
            - ["string", "clan_name", "clanName"]
            - ["string", "player_name", "playerName"]
        StyleSheet:
            styles: "~res:/UI/Screens3/Lobby/Profile/ProfilePlayerName.style.yaml"
    children:
    -   class: "UIControl"
        name: "TapArea"
        input: true
        classes: "tap-area"
        components:
            SizePolicy:
                horizontalPolicy: "PercentOfChildrenSum"
                verticalPolicy: "PercentOfChildrenSum"
            UIInputEventComponent:
                onTouchUpInside: "ON_TOUCH_UP"
            Sound:
                touchUpInside: "GUI/buttons/choose"
            StyleSheet:
                styles: "~res:/UI/Screens3/Lobby/Profile/ProfilePlayerName.style.yaml"
        children:
        -   class: "UIControl"
            name: "ContentWrapper"
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                    vCenterAnchorEnabled: true
                LinearLayout:
                    orientation: "TopDown"
                    spacing: 0.000000
                SizePolicy:
                    horizontalPolicy: "PercentOfMaxChild"
                    verticalPolicy: "PercentOfChildrenSum"
            children:
            -   class: "UIControl"
                name: "ClanInfoWrapper"
                input: false
                components:
                    Anchor:
                        leftAnchorEnabled: true
                    LinearLayout:
                        spacing: 8.000000
                    SizePolicy:
                        horizontalPolicy: "PercentOfChildrenSum"
                        verticalPolicy: "PercentOfMaxChild"
                children:
                -   class: "UIControl"
                    name: "ClanNameHolder"
                    input: false
                    components:
                        Anchor:
                            vCenterAnchorEnabled: true
                        SizePolicy:
                            horizontalPolicy: "PercentOfFirstChild"
                            verticalPolicy: "PercentOfFirstChild"
                        UIChildComponent0:
                            prototypePath: "~res:/UI/Screens3/Lobby/Common/PlayerName.yaml"
                            args:
                                "isInvertedLayout": "true"
                                "playerNameSize": "ePlayerSize.kNormal"
                                "clanTag": "clanTag"
                                "playerNameStyle": "\"bold white-wild-sand-50-text\""
                                "playerName": "clanName"
                    bindings:
                    - ["visible", "clanTag != \"\""]
                -   class: "UIControl"
                    name: "ClanInfo"
                    input: false
                    classes: "t-caps bold white-wild-sand-50-text"
                    components:
                        UITextComponent: {}
                        SizePolicy:
                            horizontalPolicy: "PercentOfContent"
                            verticalPolicy: "PercentOfContent"
                        StyleSheet:
                            styles: "~res:/UI/Screens3/Font.style.yaml"
                    bindings:
                    - ["visible", "clanTag == \"\""]
                    - ["UITextComponent.text", "localize(\"profile/Main/NotInClan\")"]
            -   class: "UIControl"
                name: "NicknameWrapper"
                position: [86.000000, 38.000000]
                pivot: [0.500000, 0.500000]
                input: false
                classes: "nickname-wrapper"
                components:
                    UIOpacityComponent: {}
                    Anchor:
                        leftAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    LinearLayout:
                        spacing: 6.000000
                    SizePolicy:
                        horizontalPolicy: "PercentOfChildrenSum"
                        verticalPolicy: "PercentOfMaxChild"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Lobby/Profile/ProfilePlayerName.style.yaml"
                children:
                -   class: "UIControl"
                    name: "Caption"
                    pivot: [0.000000, 0.000000]
                    input: false
                    classes: "t-title bold color=white-wild-sand-text"
                    components:
                        UITextComponent:
                            fitting: "FITTING_REDUCE"
                            align: ["LEFT", "VCENTER"]
                        Anchor:
                            leftAnchorEnabled: true
                            vCenterAnchorEnabled: true
                        SizePolicy:
                            horizontalPolicy: "PercentOfContent"
                            verticalPolicy: "PercentOfContent"
                        StyleSheet:
                            styles: "~res:/UI/Screens3/Font.style.yaml"
                    bindings:
                    - ["UITextComponent.text", "playerName"]
                -   class: "UIControl"
                    name: "Icon"
                    input: false
                    classes: "icon"
                    components:
                        Background:
                            drawType: "DRAW_SCALE_PROPORTIONAL"
                            sprite: "~res:/Gfx/Lobby/icons/icon_copy_s"
                        Anchor:
                            rightAnchorEnabled: true
                            vCenterAnchorEnabled: true
                            vCenterAnchor: 3.000000
                        SizePolicy:
                            horizontalPolicy: "PercentOfContent"
                            verticalPolicy: "PercentOfContent"
                        StyleSheet:
                            styles: "~res:/UI/Screens3/Color.style.yaml;~res:/UI/Screens3/Lobby/Profile/ProfilePlayerName.style.yaml"
