Header:
    version: 151
ImportedPackages:
- "~res:/UI/Screens3/Lobby/Common/Resource/PlayerAvatar.yaml"
- "~res:/UI/Screens3/Lobby/Common/PlayerName.yaml"
Prototypes:
-   class: "UIControl"
    name: "LeaderboardRow"
    size: [835.000000, 80.000000]
    input: true
    classes: "leaderboard-row button-open-sound"
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "FixedSize"
            verticalValue: 80.000000
        UIInputEventComponent:
            onTouchUpInside: "ON_LEADERBOARD_ROW_CLICKED"
            onTouchUpInsideData: "index"
        UIDataParamsComponent:
            params:
            - ["bool", "isSelfRecord", "false", "true"]
            - ["ClanTasksLeaderboardRecord", "leaderboardRecord", "null", "{ }"]
            - ["int", "index", "0", "10"]
            events:
            - "ON_LEADERBOARD_ROW_CLICKED(int index)"
        UIDataLocalBindingsComponent:
            data:
            - ["string", "backgroundColor", "when isSelfRecord -> \"gold-shining-20-bg\", \"white-wild-sand-15-bg\""]
            - ["string", "backgroundStyle", "\"background \" + backgroundColor"]
            - ["bool", "highlightingVisible", "index >= 0 and index < 3"]
            - ["string", "brightColor", "when index == 0 -> \"yellow-lightning-bg\", index == 1 -> \"blue-riptide-bg\", index == 2 -> \"orange-tango-bg\", \"\""]
        Sound: {}
        StyleSheet:
            styles: "~res:/UI/Screens3/Lobby/TaskJournal/Clan/LeaderboardRow.style.yaml;~res:/UI/Screens3/ButtonSound.style.yaml"
    bindings:
    - ["enabled", "not isSelfRecord"]
    children:
    -   class: "UIControl"
        name: "Content"
        size: [32.000000, 32.000000]
        input: false
        components:
            LinearLayout:
                padding: "24"
                dynamicSpacing: true
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
            StyleSheet:
                styles: "~res:/UI/Screens3/Color.style.yaml"
        children:
        -   class: "UIControl"
            name: "Bg"
            size: [32.000000, 32.000000]
            input: false
            components:
                Background:
                    drawType: "DRAW_SCALE_PROPORTIONAL_ONE"
                ClipContent: {}
                UIUrlImageComponent: {}
                IgnoreLayout: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
            bindings:
            - ["UIUrlImageComponent.imageUrl", "leaderboardRecord.profileBgName"]
        -   class: "UIControl"
            name: "Higlight"
            size: [32.000000, 32.000000]
            input: false
            components:
                Background: {}
                IgnoreLayout: {}
                SizePolicy:
                    horizontalPolicy: "FixedSize"
                    horizontalValue: 1.000000
                    verticalPolicy: "PercentOfParent"
            bindings:
            - ["visible", "highlightingVisible"]
            - ["classes", "brightColor"]
        -   class: "UIControl"
            name: "Bright"
            input: false
            components:
                UIOpacityComponent:
                    opacity: 0.250000
                Anchor: {}
                IgnoreLayout: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    horizontalValue: 25.000000
                    verticalPolicy: "PercentOfParent"
            bindings:
            - ["visible", "highlightingVisible"]
            children:
            -   class: "UIControl"
                name: "Element_1"
                input: false
                components:
                    Background:
                        drawType: "DRAW_SCALE_TO_RECT"
                        sprite: "~res:/Gfx/Lobby/backgrounds/bg_gradient_horizontal_0-100"
                        spriteModification: ["FLIP_HORIZONTAL"]
                    UIOpacityComponent:
                        opacity: 0.500000
                    Anchor:
                        leftAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "Formula"
                        horizontalFormula: "parent * 0.8"
                        verticalPolicy: "Formula"
                        verticalFormula: "parent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Color.style.yaml"
                bindings:
                - ["classes", "brightColor"]
            -   class: "UIControl"
                name: "Element_2"
                input: false
                components:
                    Background:
                        drawType: "DRAW_SCALE_TO_RECT"
                        sprite: "~res:/Gfx/Lobby/backgrounds/bg_gradient_horizontal_0-100"
                        spriteModification: ["FLIP_HORIZONTAL"]
                    UIOpacityComponent:
                        opacity: 0.500000
                    Anchor:
                        leftAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "Formula"
                        horizontalFormula: "parent * 0.85"
                        verticalPolicy: "Formula"
                        verticalFormula: "parent * 0.8"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Color.style.yaml"
                bindings:
                - ["classes", "brightColor"]
            -   class: "UIControl"
                name: "Element_3"
                input: false
                components:
                    Background:
                        drawType: "DRAW_SCALE_TO_RECT"
                        sprite: "~res:/Gfx/Lobby/backgrounds/bg_gradient_horizontal_0-100"
                        spriteModification: ["FLIP_HORIZONTAL"]
                    UIOpacityComponent:
                        opacity: 0.500000
                    Anchor:
                        leftAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "Formula"
                        horizontalFormula: "parent * 0.9"
                        verticalPolicy: "Formula"
                        verticalFormula: "parent * 0.6"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Color.style.yaml"
                bindings:
                - ["classes", "brightColor"]
            -   class: "UIControl"
                name: "Element_4"
                input: false
                components:
                    Background:
                        drawType: "DRAW_SCALE_TO_RECT"
                        sprite: "~res:/Gfx/Lobby/backgrounds/bg_gradient_horizontal_0-100"
                        spriteModification: ["FLIP_HORIZONTAL"]
                    UIOpacityComponent:
                        opacity: 0.500000
                    Anchor:
                        leftAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "Formula"
                        horizontalFormula: "parent * 0.95"
                        verticalPolicy: "Formula"
                        verticalFormula: "parent * 0.4"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Color.style.yaml"
                bindings:
                - ["classes", "brightColor"]
            -   class: "UIControl"
                name: "Element_5"
                input: false
                components:
                    Background:
                        drawType: "DRAW_SCALE_TO_RECT"
                        sprite: "~res:/Gfx/Lobby/backgrounds/bg_gradient_horizontal_0-100"
                        spriteModification: ["FLIP_HORIZONTAL"]
                    UIOpacityComponent:
                        opacity: 0.500000
                    Anchor:
                        leftAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "Formula"
                        horizontalFormula: "parent"
                        verticalPolicy: "Formula"
                        verticalFormula: "parent * 0.2"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Color.style.yaml"
                bindings:
                - ["classes", "brightColor"]
        -   class: "UIControl"
            name: "Background"
            size: [32.000000, 32.000000]
            input: false
            components:
                Background: {}
                UIOpacityComponent: {}
                IgnoreLayout: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Color.style.yaml;~res:/UI/Screens3/Lobby/TaskJournal/Clan/LeaderboardRow.style.yaml"
            bindings:
            - ["classes", "backgroundStyle"]
        -   class: "UIControl"
            name: "Hover"
            size: [32.000000, 32.000000]
            input: false
            classes: "hover white-wild-sand-25-bg"
            components:
                Background: {}
                UIOpacityComponent: {}
                IgnoreLayout: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Lobby/TaskJournal/Clan/LeaderboardRow.style.yaml;~res:/UI/Screens3/Color.style.yaml;"
        -   class: "UIControl"
            name: "LeftPart"
            size: [32.000000, 32.000000]
            input: false
            components:
                Anchor:
                    vCenterAnchorEnabled: true
                LinearLayout:
                    spacing: 16.000000
                SizePolicy:
                    horizontalPolicy: "PercentOfChildrenSum"
                    verticalPolicy: "PercentOfMaxChild"
            children:
            -   class: "UIControl"
                name: "Position"
                size: [32.000000, 32.000000]
                input: false
                classes: "t-caption bold white-wild-sand-text"
                components:
                    UITextComponent:
                        multiline: "MULTILINE_ENABLED"
                        align: ["HCENTER", "VCENTER"]
                    Anchor:
                        hCenterAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 32.000000
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml"
                bindings:
                - ["UITextComponent.text", "index + 1"]
            -   class: "UIControl"
                name: "PlayerAvatarWrapper"
                size: [32.000000, 32.000000]
                input: false
                components:
                    SizePolicy:
                        horizontalPolicy: "PercentOfChildrenSum"
                        verticalPolicy: "PercentOfChildrenSum"
                    UIAttachLayoutMasterComponent: {}
                bindings:
                - ["UIAttachLayoutMasterComponent.attachId", "\"position_\" + str(index)"]
                children:
                -   prototype: "PlayerAvatar/PlayerAvatar"
                    name: "PlayerAvatar"
                    components:
                        Anchor:
                            vCenterAnchorEnabled: true
                        UIDataParamsComponent:
                            args:
                                "avatar": "leaderboardRecord.avatar"
                                "badge": "\"\""
                                "enabled": "true"
                                "interactive": "false"
                                "size": "eAvatarSize.NORMAL"
                                "visible": "true"
                                "animated": "true"
            -   class: "UIControl"
                name: "PlayerNameWrapper"
                size: [32.000000, 32.000000]
                input: false
                components:
                    Anchor:
                        vCenterAnchorEnabled: true
                    LinearLayout:
                        spacing: 8.000000
                    SizePolicy:
                        horizontalPolicy: "PercentOfChildrenSum"
                        verticalPolicy: "PercentOfMaxChild"
                children:
                -   prototype: "PlayerName/PlayerName"
                    name: "PlayerName"
                    components:
                        Anchor:
                            vCenterAnchorEnabled: true
                        UIDataParamsComponent:
                            args:
                                "playerNameStyle": "when isSelfRecord -> \"bold yellow-chalky-text\", \"bold white-wild-sand-text\""
                                "playerName": "when leaderboardRecord.player.name != \"\" and isSelfRecord -> leaderboardRecord.player.name + localize(\"clanMissions/missionScreen/leaderboard/you\"), leaderboardRecord.player.name != \"\" -> leaderboardRecord.player.name, localize(\"Loading...\")"
                                "playerNameSize": "ePlayerSize.kNormal"
        -   class: "UIControl"
            name: "RightPart"
            size: [32.000000, 32.000000]
            input: false
            components:
                Anchor:
                    rightAnchorEnabled: false
                    vCenterAnchorEnabled: true
                LinearLayout:
                    orientation: "RightToLeft"
                    spacing: 36.000000
                SizePolicy:
                    horizontalPolicy: "PercentOfChildrenSum"
            children:
            -   class: "UIControl"
                name: "ClanSquadBattles"
                size: [32.000000, 32.000000]
                input: false
                classes: "t-body bold white-wild-sand-text"
                components:
                    UITextComponent: {}
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 40.000000
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml"
                bindings:
                - ["UITextComponent.text", "leaderboardRecord.battles"]
            -   class: "UIControl"
                name: "ProxyAmount"
                size: [32.000000, 32.000000]
                input: false
                classes: "t-body bold white-wild-sand-text"
                components:
                    UITextComponent:
                        multiline: "MULTILINE_DISABLED"
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 40.000000
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml"
                bindings:
                - ["UITextComponent.text", "leaderboardRecord.points"]
