Header:
    version: 161
ImportedPackages:
- "~res:/UI/Screens3/Lobby/Common/Blur.yaml"
Prototypes:
-   class: "UIControl"
    name: "AuctionSlot"
    position: [0.000000, 0.000000]
    size: [304.000000, 304.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfFirstChild"
            verticalPolicy: "PercentOfFirstChild"
        UIDataParamsComponent:
            params:
            - ["AuctionSlotViewModel", "model", "null", "{ \"slot\" = { \"state\" = eAuctionSlotState.NotStartWithRevealed; }; }"]
            - ["AuctionResources", "resources", "null", "{ }"]
            - ["SessionDataModel", "session", "null", "{ }"]
            - ["float", "shopScrollBottomOffset", "40.000000", "40.000000"]
            - ["float", "shopScrollTopOffset", "48.000000", "48.000000"]
            events:
            - "SHOW_SLOT_INFO(int id)"
            - "SELECT_SLOT(int id)"
        UIDataLocalVarsComponent:
            data:
            - ["float", "offsetSize", "400.000000"]
            - ["float", "offset", "when model.isSelected -> offsetSize, 0.000000"]
            - ["int", "maxContentSlots", "3"]
            - ["bool", "debugStateActive", "false"]
            - ["bool", "debugStateSoldOut", "false"]
            - ["bool", "debugStateEnd", "false"]
            - ["bool", "debugStateMysteruiousKit", "false"]
            - ["bool", "debugStateRevealed", "false"]
        UIDataLocalBindingsComponent:
            data:
            - ["AuctionSlotModel", "slot", "model.slot"]
            - ["float", "rewardOpacity", "1.000000"]
            - ["int", "vehicleNumber", "slot.kit.vehicleNumber"]
            - ["bool", "allContentFits", "slot.kit.rewards.Size() - vehicleNumber <= maxContentSlots"]
            - ["int", "contentSlotsToShow", "when allContentFits -> slot.kit.rewards.Size(), maxContentSlots + vehicleNumber"]
            - ["int", "moreRewardsCount", "when slot.kit.rewards.Size() - maxContentSlots > 0 -> slot.kit.rewards.Size() - maxContentSlots - vehicleNumber, 0"]
            - ["bool", "showStateActive", "debugStateActive or model.slot.state == eAuctionSlotState.Active"]
            - ["bool", "showStateSoldOut", "debugStateSoldOut or model.slot.state == eAuctionSlotState.EndWithSoldOut"]
            - ["bool", "showStateEnd", "debugStateEnd or model.slot.state == eAuctionSlotState.EndWithTimeOut"]
            - ["bool", "showStateMysteruiousKit", "debugStateMysteruiousKit or model.slot.state == eAuctionSlotState.NotStartWithHidden"]
            - ["bool", "showStateRevealed", "debugStateRevealed or model.slot.state == eAuctionSlotState.NotStartWithRevealed"]
            - ["color", "selectedBorderColor", "when showStateMysteruiousKit -> rgb(56, 88, 255), rgb(255, 168, 0)"]
            - ["bool", "priceFall", "model.slot.kit.originalPriceValue > model.slot.kit.currentPriceValue"]
            - ["bool", "footerVisible", "(showStateActive or showStateSoldOut or showStateEnd or showStateRevealed) and (slot.kit.rewards.Size() - vehicleNumber > 0)"]
        UIActionComponent:
            actionsPath: "~res:/UI/Screens3/Lobby/Auction/AuctionSlot.actions"
    children:
    -   class: "UIControl"
        name: "ContentHolder"
        input: false
        components:
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfFirstChild"
            UIChildComponent0:
                prototypePath: "~res:/UI/Screens3/Lobby/Common/ButtonDecorator.yaml"
                args:
                    "content": "Content"
                    "hasInput": "true"
                    "isSelected": "model.isSelected"
                    "ltrbSafeZone": "vec4(2.000000, 2.000000, 2.000000, 2.000000)"
                    "pushScale": "vec2(0.980000, 0.980000)"
                    "sound": "when model.isSelected -> eButtonSound.OPEN, eButtonSound.CHOOSE"
                eventActions:
                - ["PUSH", "PUSH", "_event.scale, _event.opacity, _event.time"]
                - ["PULL", "PULL", "_event.time"]
                - ["HOVER", "HOVER", "_event.brightness, _event.time"]
                - ["CANCEL_HOVER", "CANCEL_HOVER", "_event.time"]
                - ["SELECT", "SELECT", "_event.time"]
                - ["CANCEL_SELECT", "CANCEL_SELECT", "_event.time"]
                - ["ON_TOUCH", "ON_TOUCH", "model.slot.id"]
