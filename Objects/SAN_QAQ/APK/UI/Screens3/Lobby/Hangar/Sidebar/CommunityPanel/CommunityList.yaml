                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfMaxChild"
                        UIChildComponent0:
                            condition: "communityContainer.Contains(\"DISCORD\")"
                            prototypePath: "~res:/UI/Screens3/Lobby/Hangar/Sidebar/CommunityPanel/CommunityItem.yaml"
                            args:
                                "text": "localize(\"#community:Discord\")"
                                "frame": "9"
                                "sprite": "\"~res:/Gfx/UI/LobbyCommon/social_icon\""
                            eventActions:
                            - ["COMMUNITY_SELECT", "COMMUNITY_SELECT", "\"DISCORD\""]
                -   class: "UIControl"
                    name: "Viber"
                    input: false
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfMaxChild"
                        UIChildComponent0:
                            condition: "communityContainer.Contains(\"VIBER\")"
                            prototypePath: "~res:/UI/Screens3/Lobby/Hangar/Sidebar/CommunityPanel/CommunityItem.yaml"
                            args:
                                "text": "localize(\"#community:Viber\")"
                                "frame": "5"
                                "sprite": "\"~res:/Gfx/UI/LobbyCommon/social_icon\""
                            eventActions:
                            - ["COMMUNITY_SELECT", "COMMUNITY_SELECT", "\"VIBER\""]
                -   class: "UIControl"
                    name: "Portal"
                    input: false
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfMaxChild"
                        UIChildComponent0:
                            condition: "not isGamepad and communityContainer.Contains(\"Portal\")"
                            prototypePath: "~res:/UI/Screens3/Lobby/Hangar/Sidebar/CommunityPanel/CommunityItem.yaml"
                            args:
                                "text": "localize(\"#community:Portal\")"
                                "frame": "7"
