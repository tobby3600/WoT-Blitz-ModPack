                            condition: "communityContainer.Contains(\"Instagram\")"
                            prototypePath: "~res:/UI/Screens3/Lobby/Hangar/Sidebar/CommunityPanel/CommunityItem.yaml"
                            args:
                                "text": "localize(\"#community:Instagram\")"
                                "frame": "4"
                                "sprite": "\"~res:/Gfx/UI/LobbyCommon/social_icon\""
                            eventActions:
                            - ["COMMUNITY_SELECT", "COMMUNITY_SELECT", "\"INSTAGRAM\""]
                -   class: "UIControl"
                    name: "Discord"
                    input: false
                    components:
