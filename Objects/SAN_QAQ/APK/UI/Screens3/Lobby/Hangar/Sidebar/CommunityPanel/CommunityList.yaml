Header:
    version: 161
ImportedPackages:
- "~res:/UI/Screens3/Common/VerticalScrollBar.yaml"
- "~res:/UI/Screens3/Common/BlurModified.yaml"
Prototypes:
-   class: "UIControl"
    name: "CommunityPanel"
    size: [348.000000, 490.000000]
    input: false
    components:
        UIAnimationComponent:
            animations: "_INIT,~res:/UI/Screens3/Lobby/Common/SubPanelStart.animation;_FINISH,~res:/UI/Screens3/Lobby/Common/SubPanelFinish.animation"
        UIOpacityComponent: {}
        SizePolicy:
            horizontalPolicy: "FixedSize"
            horizontalValue: 348.000000
            verticalPolicy: "PercentOfParent"
        UIDataParamsComponent:
            params:
            - ["vector<string>", "communityContainer", "null", "[ \"VK\"; \"FACEBOOK\"; \"YOUTUBE\"; \"TWITTER\"; \"INSTAGRAM\"; \"VIBER\"; \"PORTAL\"; \"WARGAMING\"; \"GIFTSHOP\"; \"DISCORD\"; \"NONE\"; ]"]
            events:
            - "COMMUNITY_SELECT"
        UIDataLocalVarsComponent:
            data:
            - ["int", "panelWidth", "348"]
        StyleSheet:
            styles: "~res:/UI/Screens3/Color.style.yaml"
    children:
    -   class: "UIControl"
        name: "Content"
        size: [32.000000, 32.000000]
        input: false
        components:
            UIOpacityComponent: {}
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
        children:
        -   class: "UIScrollView"
            name: "ScrollArea"
            autoUpdate: true
            components:
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
            children:
            -   prototype: "BlurModified/BlurModified"
                name: "Bg"
                components:
                    UIDataParamsComponent:
                        args:
                            "bgStyle": "\"black-50-bg\""
            -   class: "UIScrollViewContainer"
                name: "scrollContainerControl"
                components:
                    LinearLayout:
                        orientation: "TopDown"
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        verticalPolicy: "PercentOfChildrenSum"
                children:
                -   class: "UIControl"
                    name: "Header"
                    size: [32.000000, 32.000000]
                    input: false
                    components:
                        LinearLayout:
                            orientation: "TopDown"
                            padding: "32; 28"
                            spacing: 16.000000
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfChildrenSum"
                    children:
                    -   class: "UIControl"
                        name: "Title"
                        input: false
                        classes: "t-headline regular white-wild-sand-text"
                        components:
                            UITextComponent:
                                text: "hangar/CommunityPanel/Header/Community"
                                fitting: "FITTING_POINTS"
                                align: ["LEFT", "VCENTER"]
                            Anchor:
                                leftAnchorEnabled: true
                                leftAnchor: 16.000000
                            SizePolicy:
                                horizontalPolicy: "Formula"
                                horizontalFormula: "parent - 32"
                                verticalPolicy: "PercentOfContent"
                            StyleSheet:
                                styles: "~res:/UI/Screens3/Font.style.yaml"
                -   class: "UIControl"
                    name: "Vk"
                    input: false
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfMaxChild"
                        UIChildComponent0:
                            condition: "communityContainer.Contains(\"VK\")"
                            prototypePath: "~res:/UI/Screens3/Lobby/Hangar/Sidebar/CommunityPanel/CommunityItem.yaml"
                            args:
                                "text": "localize(\"#community:VK\")"
                                "frame": "2"
                                "sprite": "\"~res:/Gfx/UI/LobbyCommon/social_icon\""
                            eventActions:
                            - ["COMMUNITY_SELECT", "COMMUNITY_SELECT", "\"VK\""]
                -   class: "UIControl"
                    name: "Fb"
                    input: false
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfMaxChild"
                        UIChildComponent0:
                            condition: "communityContainer.Contains(\"Facebook\")"
                            prototypePath: "~res:/UI/Screens3/Lobby/Hangar/Sidebar/CommunityPanel/CommunityItem.yaml"
                            args:
                                "text": "localize(\"#community:FB\")"
                                "frame": "3"
                                "sprite": "\"~res:/Gfx/UI/LobbyCommon/social_icon\""
                            eventActions:
                            - ["COMMUNITY_SELECT", "COMMUNITY_SELECT", "\"FACEBOOK\""]
                -   class: "UIControl"
                    name: "Youtube"
                    input: false
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfMaxChild"
                        UIChildComponent0:
                            condition: "communityContainer.Contains(\"Youtube\")"
                            prototypePath: "~res:/UI/Screens3/Lobby/Hangar/Sidebar/CommunityPanel/CommunityItem.yaml"
                            args:
                                "text": "localize(\"#community:Youtube\")"
                                "frame": "1"
                                "sprite": "\"~res:/Gfx/UI/LobbyCommon/social_icon\""
                            eventActions:
                            - ["COMMUNITY_SELECT", "COMMUNITY_SELECT", "\"YOUTUBE\""]
                -   class: "UIControl"
                    name: "Twitter"
                    input: false
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfMaxChild"
                        UIChildComponent0:
