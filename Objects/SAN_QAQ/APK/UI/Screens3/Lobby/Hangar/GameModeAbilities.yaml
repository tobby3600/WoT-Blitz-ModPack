Header:
    version: 157
ImportedPackages:
- "~res:/UI/Screens3/Lobby/Common/Button.yaml"
- "~res:/UI/Screens3/Lobby/Common/Timer.yaml"
- "~res:/UI/Screens3/Common/BlurModified.yaml"
Prototypes:
-   class: "UIControl"
    name: "GameModePopup"
    classes: "game-mode-popup button-open-sound"
    components:
        UIOpacityComponent: {}
        SizePolicy:
            horizontalPolicy: "Formula"
            horizontalFormula: "maxChild + 32"
            verticalPolicy: "Formula"
            verticalFormula: "maxChild + 16"
        UIAttachLayoutSlaveComponent: {}
        UIInputEventComponent:
            onTouchUpInside: "ON_ABILITIES"
        UIDataParamsComponent:
            params:
            - ["vector<EquipmentModel>", "abilities", "null", "[ { \"icon\" = \"moonwalk\"; }; { \"icon\" = \"tornado\"; }; { \"icon\" = \"moonwalk\"; }; { \"icon\" = \"tornado\"; }; ]"]
            - ["string", "masterId", "\"MASTER\"", "\"MASTER\""]
            - ["vector2", "masterOffset", "vec2(0, 0)", "vec2(0, 0)"]
            - ["bool", "isInputEnabled", "true", "true"]
            - ["float", "opacityValue", "0", "1"]
            - ["bool", "isArrowTop", "true", "true"]
            events:
            - "ON_ABILITIES"
        UIDataLocalBindingsComponent:
            data:
            - ["string", "title", "\"#abilitiesPopup/Title\""]
        Sound: {}
        StyleSheet:
            styles: "~res:/UI/Screens3/ButtonSound.style.yaml;~res:/UI/Screens3/Common/Hover.style.yaml"
    bindings:
    - ["input", "isInputEnabled"]
    - ["UIOpacityComponent.opacity", "opacityValue"]
    - ["UIAttachLayoutSlaveComponent.attachId", "masterId"]
    - ["UIAttachLayoutSlaveComponent.additionalOffset", "masterOffset"]
    children:
    -   class: "UIControl"
        name: "Content"
        position: [110.000000, 60.000000]
        size: [204.000000, 72.000000]
        pivot: [0.500000, 0.500000]
        input: false
        classes: "content-area"
        components:
            Anchor:
                leftAnchorEnabled: true
                leftAnchor: 8.000000
                rightAnchorEnabled: true
                rightAnchor: 8.000000
                topAnchorEnabled: true
                topAnchor: 8.000000
                bottomAnchorEnabled: true
                bottomAnchor: 8.000000
            LinearLayout:
                orientation: "TopDown"
                padding: "8;4"
                spacing: 4.000000
            SizePolicy:
                horizontalPolicy: "Formula"
                horizontalFormula: "maxChild + 32"
                verticalPolicy: "PercentOfChildrenSum"
            StyleSheet:
                styles: "~res:/UI/Screens3/Color.style.yaml;~res:/UI/Screens3/Common/Touch.style.yaml"
        children:
        -   prototype: "BlurModified/BlurModified"
            name: "Blur"
            components:
                UIDataParamsComponent:
                    args:
                        "bgStyle": "\"black-50-bg\""
                        "roundCorner": "\"8\""
        -   class: "UIControl"
            name: "Hover"
            position: [0.000000, 0.000000]
            size: [204.000000, 100.000000]
            input: false
            classes: "hover black-15-bg"
            components:
                Background: {}
                UIOpacityComponent: {}
                IgnoreLayout: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Color.style.yaml;~res:/UI/Screens3/Common/Hover.style.yaml"
            children:
            -   class: "UIControl"
                name: "Bg"
                input: false
                classes: "black-15-bg"
                components:
                    Background:
                        drawType: "DRAW_STRETCH_BOTH"
                        sprite: "~res:/Gfx/Lobby/backgrounds/bg_r8"
                        leftRightStretchCap: 8.000000
                        topBottomStretchCap: 8.000000
                    IgnoreLayout: {}
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        verticalPolicy: "PercentOfParent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Color.style.yaml"
        -   class: "UIControl"
            name: "Title"
            input: false
            classes: "t-caps bold white-wild-sand-text"
            components:
                UITextComponent: {}
                Anchor:
                    hCenterAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "PercentOfContent"
                    verticalPolicy: "PercentOfContent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Common/PopupMenu.style.yaml"
            bindings:
            - ["visible", "title != \"\""]
            - ["UITextComponent.text", "localize(title)"]
        -   class: "UIControl"
            name: "GameModeAbilities"
            input: false
            classes: ""
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                LinearLayout:
                    spacing: 4.000000
                SizePolicy:
                    horizontalPolicy: "PercentOfChildrenSum"
                    verticalPolicy: "PercentOfMaxChild"
                UIDataParamsComponent:
                    params:
                    - ["vector<EquipmentModel>", "abilities", "null", "[ { \"icon\" = \"curse\"; }; { \"icon\" = \"tornado\"; }; ]"]
                    args:
                        "abilities": "abilities"
                UIRepeatComponent:
                    control: "~res:/UI/Screens3/Lobby/Hangar/HangarAbility.yaml"
                    dataContainer: "abilities"
                    args:
                        "equipment": "_item"
