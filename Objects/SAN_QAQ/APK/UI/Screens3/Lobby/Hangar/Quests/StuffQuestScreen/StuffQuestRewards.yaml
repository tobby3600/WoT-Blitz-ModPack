Header:
    version: 155
ImportedPackages:
- "~res:/UI/Screens3/Lobby/Common/BlurLite.yaml"
- "~res:/UI/Screens3/Common/HorizontalScrollBar.yaml"
Prototypes:
-   class: "UIControl"
    name: "StuffQuestRewards"
    size: [698.000000, 160.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfFirstChild"
        UILayoutEventComponent:
            sizeChangedEvent: "ON_SIZE_CHANGED"
            sizeChangedEventData: "_size"
        UIDataParamsComponent:
            params:
            - ["int", "questIndex", "0", "0"]
            - ["QuestRewards", "rewards", "null", "{ }"]
            - ["string", "bgSource", "\"\"", "\"\""]
            - ["bool", "showGlow", "false", "true"]
            - ["bool", "showBlur", "true", "true"]
            - ["bool", "showScroll", "true", "true"]
            - ["bool", "showShadow", "true", "true"]
            - ["bool", "reverseOrder", "false", "false"]
            - ["bool", "inputEnabled", "true", "true"]
            events:
            - "ON_REWARD_CLICKED(int index)"
        UIDataLocalVarsComponent:
            data:
            - ["vector2", "size", "vec2(0, 0)"]
        UIDataLocalBindingsComponent:
            data:
            - ["bool", "needScroll", "rewards.resources.Size() * 140 > size.X"]
            - ["string", "id", "\"quest_\" + str(questIndex) + \"_reward_\" + rewards.id"]
        UIChildComponent0:
            childType: "kControl"
            condition: "showScroll"
            control: "MaskedContent"
        UIChildComponent1:
            childType: "kControl"
            condition: "not showScroll"
            control: "Rewards"
        UIDataOnEventComponent0:
            eventName: "ON_SIZE_CHANGED"
            modelFieldExpression: "size"
            dataExpression: "_event"
Slots:
-   class: "UIControl"
    name: "Rewards"
    input: false
    components:
        Anchor:
            hCenterAnchorEnabled: true
            vCenterAnchorEnabled: true
            vCenterAnchor: -2.000000
        LinearLayout: {}
        SizePolicy:
            horizontalPolicy: "PercentOfChildrenSum"
            verticalPolicy: "FixedSize"
            verticalValue: 144.000000
        UIRepeatComponent:
            control: "~res:/UI/Screens3/Lobby/Hangar/Quests/StuffQuestScreen/StuffQuestReward.yaml"
            dataContainer: "rewards.resources"
            args:
                "inputEnabled": "inputEnabled"
                "resource": "_item"
                "attachId": "id + \"_index_\" + str(_index)"
            eventActions:
            - ["ON_REWARD_CLICKED", "ON_REWARD_CLICKED", "_index"]
            elementNameExpression: "id + \"_index_\" + str(_index)"
    bindings:
    - ["LinearLayout.orientation", "when reverseOrder -> eOrientation.RightToLeft, eOrientation.LeftToRight"]
-   class: "UIControl"
    name: "MaskedContent"
    input: false
