Header:
    version: 153
ImportedPackages:
- "~res:/UI/Screens3/Common/VerticalScrollBar.yaml"
Prototypes:
-   class: "UIControl"
    name: "AdvertisingGoldOverlay"
    size: [1300.000000, 800.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfParent"
        UIDataParamsComponent:
            params:
            - ["LobbyDataModel", "lobby", "null", "{ }"]
            - ["bool", "centerButtons", "false", "true"]
            - ["SessionDataModel", "session", "null", "{ }"]
            - ["bool", "hasOpenedOverlays", "false", "true"]
            - ["bool", "wasPushed", "true", "true"]
            - ["bool", "manualCloseEnabled", "true", "false"]
            events:
            - "BACK_EVENT"
            - "EXTRA2_ACTION"
            - "ON_MAIN_REWARD_CLICKED"
            - "ON_INFO_CLICKED"
            - "ON_REWARD_CLICKED(ResourceDetailed resource, string name)"
        UIDataLocalVarsComponent:
            data:
            - ["int", "footerH", "96"]
            - ["int", "contentH", "0"]
            - ["string", "stuffCount", "\"1\""]
            - ["int", "stuffHeight", "0"]
            - ["int", "spacingH", "80"]
        UIDataLocalBindingsComponent:
            data:
            - ["vector<ResourceDetailed>", "rewards", "session.serverConfig.advertising.hangar.reward"]
            - ["bool", "canWatch", "session.stats.hangarAds.nextViewTime <= session.serverTime"]
            - ["int", "overallH", "int(stuffHeight) + spacingH"]
        UIChildComponent0:
            prototypePath: "~res:/UI/Screens3/Lobby/Common/Overlay/OverlayBasic.yaml"
            args:
                "scaleBg": "true"
                "customBgStyle": "\"black-bg\""
                "imageFromClient": "\"~res:/Gfx/Lobby/backgrounds/bg_ads_overlay\""
                "hasCustomBg": "true"
                "manualCloseEnabled": "manualCloseEnabled"
                "footerHeight": "footerH"
                "closeButtonIcon": "when hasOpenedOverlays -> \"~res:/Gfx/Lobby/icons/icon_arrow-back\", \"\""
                "isFooterVisible": "true"
                "footerContent": "Footer"
                "wasPushed": "wasPushed"
                "contentHeight": "overallH"
                "titleContent": "Title"
                "customBgURL": "\"\""
                "content": "Content"
                "fullWidthFooter": "true"
            eventActions:
            - ["EXTRA2_ACTION", "EXTRA2_ACTION", ""]
            - ["OVERLAY_CONTENT_HEIGHT_CHANGED", "OVERLAY_CONTENT_HEIGHT_CHANGED", "_event"]
            - ["BACK_EVENT", "BACK_EVENT", ""]
        UIActionComponent:
            actionsPath: "~res:/UI/Screens3/Lobby/Advertising/ShopAdvertisingOverlay.actions"
        UIDataOnEventComponent0:
            eventName: "OVERLAY_CONTENT_HEIGHT_CHANGED"
            modelFieldExpression: "contentH"
            dataExpression: "int(_event)"
Slots:
-   class: "UIControl"
    name: "Title"
    input: false
    components:
        Anchor:
            hCenterAnchorEnabled: true
            topAnchorEnabled: true
            topAnchor: 32.000000
        LinearLayout:
            spacing: 16.000000
        SizePolicy:
            horizontalPolicy: "PercentOfChildrenSum"
            verticalPolicy: "PercentOfMaxChild"
        UIChildComponent0:
            prototypePath: "~res:/UI/Screens3/Lobby/Chests/ChestTite.yaml"
            args:
                "grade": "ArtefactGrade.unknown"
                "title": "localize(\"Ads/HangarGoldOverlay/Title\")"
-   class: "UIControl"
    name: "Content"
    size: [655.000000, 388.000000]
    input: false
    components:
        Anchor:
            hCenterAnchorEnabled: true
            topAnchorEnabled: true
        LinearLayout: {}
        SizePolicy:
            horizontalPolicy: "Formula"
            horizontalFormula: "when parent < 1200 -> 832, 1072"
            verticalPolicy: "PercentOfParent"
    children:
    -   class: "UIControl"
        name: "LeftContent"
        input: false
        components:
            LinearLayout:
                orientation: "TopDown"
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "FixedSize"
        bindings:
        - ["SizePolicy.verticalValue", "contentH"]
        children:
        -   class: "UIControl"
            name: "ImageWrapper"
            input: false
            components:
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
                UIChildComponent0:
                    prototypePath: "~res:/UI/Screens3/Lobby/Chests/ChestImageWrapper.yaml"
                    args:
                        "withAnimation": "wasPushed"
                        "image": "\"~res:/Gfx/Lobby/backgrounds/bg_ads-overlay-gold\""
    -   class: "UIControl"
        name: "Info"
        input: false
        components:
            Anchor:
                topAnchorEnabled: true
            LinearLayout:
                orientation: "TopDown"
            SizePolicy:
                horizontalPolicy: "PercentOfMaxChild"
                verticalPolicy: "PercentOfParent"
        children:
        -   class: "UIControl"
            name: "VerticalScrollView"
            input: false
            components:
                SizePolicy:
                    horizontalPolicy: "PercentOfMaxChild"
                    verticalPolicy: "PercentOfParent"
                StyleSheet: {}
            children:
            -   class: "UIScrollView"
                name: "ScrollArea"
                refreshStylesOnInteract: false
                autoUpdate: true
                components:
                    SizePolicy:
                        horizontalPolicy: "PercentOfMaxChild"
                        verticalPolicy: "PercentOfParent"
                children:
                -   class: "UIScrollViewContainer"
                    name: "scrollContainerControl"
                    refreshStylesOnInteract: false
                    scrollDirection: "kVertical"
                    components:
                        LinearLayout:
                            orientation: "TopDown"
                            padding: "6; 0"
                            spacing: 8.000000
                        SizePolicy:
                            horizontalPolicy: "PercentOfMaxChild"
                            verticalPolicy: "PercentOfChildrenSum"
                    children:
                    -   class: "UIControl"
                        name: "Obtainment"
                        input: false
                        components:
                            SizePolicy:
                                horizontalPolicy: "PercentOfParent"
                                verticalPolicy: "PercentOfChildrenSum"
                            UIChildComponent0:
                                childType: "kControl"
                                control: "Info"
                    -   class: "UIControl"
                        name: "DropList"
                        input: false
                        components:
                            SizePolicy:
                                horizontalPolicy: "Formula"
                                horizontalFormula: "when screenWidth > 1232 -> 572, 384"
                                verticalPolicy: "PercentOfMaxChild"
                            UIChildComponent0:
                                prototypePath: "~res:/UI/Screens3/Lobby/Chests/InfoMenu.yaml"
                                args:
                                    "collapsed": "true"
                                    "additionalText": "capitalize(stuffCount)"
                                    "title": "\"hangar/subheader/bundleContents\""
                                    "content": "Rewards"
            -   prototype: "VerticalScrollBar/VerticalScrollBar"
                name: "VerticalScrollBar"
                components:
                    Anchor:
                        rightAnchorEnabled: true
                        rightAnchor: -56.000000
                        topAnchorEnabled: true
                        topAnchor: 8.000000
                        bottomAnchorEnabled: true
                    UIScrollBarComponent:
                        delegate: "../ScrollArea"
-   class: "UIControl"
    name: "Footer"
    input: false
    components:
        Anchor:
            hCenterAnchorEnabled: true
        LinearLayout:
            orientation: "TopDown"
            padding: "24"
        SizePolicy:
            horizontalPolicy: "Formula"
            horizontalFormula: "when parent < 1200 -> 832, 1072"
            verticalPolicy: "FixedSize"
            verticalValue: 96.000000
    children:
    -   class: "UIControl"
        name: "Action"
        input: false
        components:
            Anchor: {}
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfFirstChild"
            UIChildComponent0:
                childType: "kPrototype"
                prototypePath: "~res:/UI/Screens3/Lobby/Advertising/ShopAdvertisingButton.yaml"
                args:
                    "nextViewTime": "session.stats.hangarAds.nextViewTime"
                    "canWatch": "canWatch"
                    "adAvailable": "lobby.advertising.hangarAdAvailable"
                    "serverTime": "session.serverTime"
                    "remainingAds": "session.stats.hangarAds.remainingAds"
                eventActions:
                - ["WATCH_AD", "WATCH_AD", ""]
                - ["COOLDOWN_HINT", "COOLDOWN_HINT", ""]
                - ["NO_ADS_HINT", "NO_ADS_HINT", ""]
        bindings:
        - ["Anchor.hCenterAnchorEnabled", "centerButtons"]
        - ["Anchor.rightAnchorEnabled", "not centerButtons"]
-   class: "UIControl"
    name: "Rewards"
    input: false
    components:
        Anchor:
            hCenterAnchorEnabled: true
            bottomAnchorEnabled: true
        SizePolicy:
            horizontalPolicy: "FixedSize"
            verticalPolicy: "PercentOfChildrenSum"
        FlowLayout:
            hSpacing: 8.000000
            vSpacing: 8.000000
        UILayoutEventComponent:
            sizeChangedEvent: "StuffChanged"
            sizeChangedEventData: "_size.Y"
        UIRepeatComponent:
            control: "~res:/UI/Screens3/Lobby/Chests/ChestContentItem.yaml"
            dataContainer: "rewards"
            args:
                "ownedItem": "false"
                "attachId": "\"reward_\" + str(_index)"
                "max": "_item.basic.quantity"
                "min": "_item.basic.quantity"
                "resource": "_item"
            eventActions:
            - ["ON_REWARD_CLICKED", "ON_REWARD_CLICKED", "_event, \"reward_\" + str(_index)"]
    bindings:
    - ["SizePolicy.horizontalValue", "when screenWidth > 1232 -> 556, 368"]
-   class: "UIControl"
    name: "Info"
    size: [384.000000, 36.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfFirstChild"
        UIChildComponent0:
            prototypePath: "~res:/UI/Screens3/Lobby/Chests/InfoMenu.yaml"
            args:
                "collapsed": "true"
                "title": "\"storage/Items/Obtainment\""
                "content": "Obtainment"
-   class: "UIControl"
    name: "Obtainment"
    size: [384.000000, 32.000000]
    input: false
    components:
        LinearLayout:
            orientation: "TopDown"
            spacing: 18.000000
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfChildrenSum"
    children:
    -   class: "UIControl"
        name: "Description"
        input: false
        components:
            RichContent:
                baseClasses: "t-body regular white-wild-sand-50-text"
            RichContentAliases0:
                aliases:
                - ["highlighted", "<span class=\"t-body regular white-wild-sand-text\" />"]
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfChildrenSum"
            FlowLayout:
                hSpacing: 5.000000
                vSpacing: 3.000000
                useRtl: true
            StyleSheet:
                styles: "~res:/UI/Screens3/Font.style.yaml"
        bindings:
        - ["RichContent.text", "localize(\"Ads/HangarGold/Obtainment/Description\")"]
