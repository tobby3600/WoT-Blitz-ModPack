Header:
    version: 161
Prototypes:
-   class: "UIControl"
    name: "SmartDlcInitialization"
    size: [960.000000, 640.000000]
    input: false
    components:
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfParent"
        UIDataParamsComponent:
            params:
            - ["PreLoginData", "preLoginData", "null", "{ \"smartDlcLoading\" = true; }"]
            events:
            - "ICP_NUMBER_LINK_PRESS"
    children:
    -   class: "UIStaticText"
        name: "DescriptionControl"
        size: [1024.000000, 60.000000]
        pivot: [0.500000, 0.000000]
        classes: "t-body regular white-wild-sand-text"
        components:
            UITextComponent:
                text: "Connecting..."
                align: ["HCENTER", "TOP", "VCENTER"]
            Anchor:
                leftAnchorEnabled: true
                rightAnchorEnabled: true
                vCenterAnchorEnabled: true
                vCenterAnchor: 55.000000
            StyleSheet:
                styles: "~res:/UI/Screens3/Font.style.yaml"
        bindings:
        - ["visible", "preLoginData.smartDlcLoading"]
    -   class: "UIControl"
        name: "Spinner"
        input: false
        components:
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfFirstChild"
            UIChildComponent0:
                condition: "preLoginData.smartDlcLoading"
                prototypePath: "~res:/UI/Screens3/Common/LoadingSpinner.yaml"
    -   class: "UIControl"
        name: "AOGASControl"
        position: [374.000000, 64.000000]
        input: false
        classes: "white-wild-sand-15-bg"
        components:
            Anchor:
                hCenterAnchorEnabled: true
                topAnchorEnabled: true
            Background: {}
            UIRoundedCornersComponent:
                radius: "8"
            SizePolicy:
                horizontalPolicy: "PercentOfChildrenSum"
                horizontalValue: 115.000000
                verticalPolicy: "PercentOfChildrenSum"
                verticalValue: 125.000000
            StyleSheet:
                styles: "~res:/UI/Screens3/Color.style.yaml"
            UIChildComponent0:
                condition: "preLoginData.isChina"
                prototypePath: "~res:/UI/Screens3/PreLogin/AOGASControl.yaml"
        bindings:
        - ["visible", "preLoginData.isChina"]
        - ["Anchor.topAnchor", "when (screenHeight > 640 and screenHeight < 1023) -> 64.000000, screenHeight / 13.500000"]
    -   class: "UIControl"
        name: "AgeRatingInfo"
        size: [265.000000, 220.000000]
        input: false
        classes: "white-wild-sand-15-bg"
        components:
            Anchor:
                hCenterAnchorEnabled: true
                bottomAnchorEnabled: true
            Background: {}
            UIRoundedCornersComponent:
                radius: "8"
            LinearLayout:
                orientation: "TopDown"
                dynamicPadding: true
                spacing: 8.000000
            SizePolicy:
                horizontalPolicy: "PercentOfMaxChild"
                horizontalValue: 115.000000
                verticalPolicy: "PercentOfChildrenSum"
                verticalValue: 125.000000
            StyleSheet:
                styles: "~res:/UI/Screens3/Color.style.yaml"
        bindings:
        - ["visible", "preLoginData.isChina"]
        - ["Anchor.bottomAnchor", "when (screenHeight > 640 and screenHeight < 1023) -> 16.000000, screenHeight / 54.000000"]
        children:
        -   class: "UIControl"
            name: "SelfRegulatoryConvention"
            input: false
            classes: "t-body regular white-wild-sand-text"
            components:
                UITextComponent:
                    text: "netease/loginScreen/AASSelfRegulatoryConvention"
                Anchor:
                    hCenterAnchorEnabled: true
                    vCenterAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "PercentOfContent"
                    verticalPolicy: "PercentOfContent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
        -   class: "UIControl"
            name: "TextWrapper1"
            position: [0.000000, 0.000000]
            size: [406.000000, 20.000000]
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                LinearLayout:
                    spacing: 16.000000
                SizePolicy:
                    horizontalPolicy: "PercentOfChildrenSum"
                    verticalPolicy: "PercentOfMaxChild"
            children:
            -   class: "UIControl"
                name: "ClearanceNumberGAPP"
                input: false
                classes: "t-body regular white-wild-sand-text"
                components:
                    UITextComponent:
                        text: "netease/loginScreen/clearanceNumberGAPP"
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfContent"
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
            -   class: "UIControl"
                name: "PublicationNumberGAPP"
                input: false
                classes: "t-body regular white-wild-sand-text"
                components:
                    UITextComponent:
                        text: "netease/loginScreen/publicationNumberGAPP"
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfContent"
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
        -   class: "UIControl"
            name: "TextWrapper2"
            position: [62.000000, 28.000000]
            size: [406.000000, 20.000000]
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                LinearLayout:
                    spacing: 16.000000
                SizePolicy:
                    horizontalPolicy: "PercentOfChildrenSum"
                    verticalPolicy: "PercentOfMaxChild"
            children:
            -   class: "UIControl"
                name: "ClearanceNumberMOC"
                input: false
                classes: "t-body regular white-wild-sand-text"
                components:
                    UITextComponent:
                        text: "netease/loginScreen/clearanceNumberMOC"
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfContent"
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
            -   class: "UIControl"
                name: "ICPBackNo"
                input: false
                components:
                    Anchor:
                        hCenterAnchorEnabled: false
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfMaxChild"
                        verticalPolicy: "PercentOfMaxChild"
                    UIChildComponent0:
                        prototypePath: "~res:/UI/Screens3/Lobby/Common/RichTextICPNumberLink.yaml"
                        args:
                            "soundStyle": "\"button-open-sound\""
                            "baseFontSize": "\"t-body\""
                            "key": "localize(\"netease/loginScreen/ICP_registration_number\")"
                        eventActions:
                        - ["LINK_PRESSED", "ICP_NUMBER_LINK_PRESS", ""]
        -   class: "UIControl"
            name: "PublisherInformation"
            input: false
            classes: "t-body regular white-wild-sand-text"
            components:
                UITextComponent:
                    text: "netease/loginScreen/publisherInformation"
                Anchor:
                    hCenterAnchorEnabled: true
                    vCenterAnchorEnabled: false
                SizePolicy:
                    horizontalPolicy: "PercentOfContent"
                    verticalPolicy: "PercentOfContent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
        -   class: "UIControl"
            name: "CopyrightOwner"
            position: [74.000000, 56.000000]
            input: false
            classes: "t-body regular white-wild-sand-text"
            components:
                UITextComponent:
                    text: "netease/loginScreen/gameCopyrightOwner"
                Anchor:
                    hCenterAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "PercentOfContent"
                    verticalPolicy: "PercentOfContent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Font.style.yaml;~res:/UI/Screens3/Color.style.yaml"
