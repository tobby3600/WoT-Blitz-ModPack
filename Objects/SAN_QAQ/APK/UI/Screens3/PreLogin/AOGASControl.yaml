Header:
    version: 155
Prototypes:
-   class: "UIControl"
    name: "AOGASControl"
    input: false
    components:
        Anchor:
            hCenterAnchorEnabled: true
            vCenterAnchorEnabled: true
        LinearLayout:
            orientation: "TopDown"
            spacing: 8.000000
        SizePolicy:
            horizontalPolicy: "PercentOfMaxChild"
            verticalPolicy: "PercentOfChildrenSum"
        StyleSheet:
            styles: "~res:/UI/Screens3/Font.style.yaml"
    children:
    -   class: "UIControl"
        name: "Header"
        input: false
        classes: "t-headline bold white-wild-sand-text"
        components:
            Anchor:
                hCenterAnchorEnabled: true
            UITextComponent: {}
            SizePolicy:
                horizontalPolicy: "PercentOfContent"
                verticalPolicy: "PercentOfContent"
        bindings:
        - ["UITextComponent.text", "localize(\"#SAN_QAQ_ModPack/Header\")"]
    -   class: "UIControl"
        name: "Description"
        input: false
        classes: "t-body regular white-wild-sand-text"
        components:
            Anchor:
                hCenterAnchorEnabled: true
            UITextComponent:
                multiline: "MULTILINE_ENABLED"
            SizePolicy:
                horizontalPolicy: "PercentOfContent"
                verticalPolicy: "PercentOfContent"
        bindings:
        - ["UITextComponent.text", "localize(\"#SAN_QAQ_ModPack/Description\")"]
