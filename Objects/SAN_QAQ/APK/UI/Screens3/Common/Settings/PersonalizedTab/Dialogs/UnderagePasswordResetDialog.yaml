Header:
    version: 161
ImportedPackages:
- "~res:/UI/Screens3/Common/OverlayBlur.yaml"
- "~res:/UI/Screens3/Lobby/Common/Button.yaml"
Prototypes:
-   class: "UIControl"
    name: "UnderagePasswordResetDialog"
    size: [1200.000000, 640.000000]
    input: false
    components:
        UIAnimationComponent:
            animations: "_INIT,~res:/UI/Screens3/Lobby/Common/Dialog/DialogOpen.animation"
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfParent"
        ModalInput: {}
        UIVirtualActionEventComponent0:
            virtualKeyAction: "Extra2"
            keyDownEvent: "ENTER_SHORTCUT"
        UIVirtualActionEventComponent1:
            virtualKeyAction: "Escape"
            keyDownEvent: "BACK_SHORTCUT"
        UIShortcutEventComponent:
            shortcuts: "BACK_SHORTCUT,Back;BACK_SHORTCUT,Escape;ENTER_SHORTCUT,Enter;BACK_SHORTCUT,Gamepad A"
        UIDataParamsComponent:
            params:
            - ["int64", "serverTime", "0L", "43251253L"]
            - ["int64", "expireTime", "0L", "43261374L"]
            - ["bool", "shortFormat", "false", "false"]
            - ["eDialogType", "type", "eDialogType.CHOOSE", "eDialogType.CHOOSE"]
            - ["bool", "backEnabled", "true", "true"]
            - ["bool", "closeByTap", "false", "false"]
            events:
            - "APPLY"
            - "CANCEL"
            eventActions:
            - ["OPTIONAL_CLICKED", "CANCEL", ""]
        UIDataLocalVarsComponent:
            data:
            - ["eButtonType", "optionalButtonType", "eButtonType.OPTIONAL_LIGHT"]
            - ["string", "optionalButtonText", "\"#common:DialogButton/Cancel\""]
        UIDataLocalBindingsComponent:
            data:
            - ["bool", "isExpire", "serverTime >= expireTime"]
            - ["eButtonType", "accentButtonType", "eButtonType.POSITIVE"]
            - ["string", "header", "\"#settings:Personalized/Dialogs/Underage/AutoResetPassword/ResetUnderageTitle\""]
            - ["control", "contentControl1", "control(\"~res:/UI/Screens3/Lobby/Common/Dialog/TextContent.yaml\", { \"contentText\" = localize(\"#settings:Personalized/Dialogs/Underage/AutoResetPassword/ResetUnderageDescription\"); }, [ ])"]
            - ["string", "time_left", "when shortFormat -> timeDiffShort(expireTime - serverTime), timeDiff(expireTime - serverTime)"]
            - ["control", "contentControl2", "control(\"~res:/UI/Screens3/Lobby/Common/Dialog/TextContent.yaml\", { \"contentText\" = localize(\"#settings:Personalized/ContentTags/Underage/AutoResetPassword/WithDrawRest/Description\", { \"time_left\" = time_left; }); }, [ ])"]
            - ["string", "accentButtonText", "when isExpire -> \"#settings:Personalized/Dialogs/Underage/AutoResetPassword/ResetButton\", \"#settings:Personalized/Dialogs/Underage/AutoResetPassword/WithDrawCloseButton\""]
        UIActionComponent:
            actionsPath: "~res:/UI/Screens3/Lobby/Common/Dialog/Dialog.actions"
    children:
    -   prototype: "OverlayBlur/BlurAndFade"
        name: "BlurAndFade"
        components:
            StyleSheet: {}
    -   class: "UIControl"
        name: "TapArea"
        components:
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "Formula"
                horizontalFormula: "parent - 32"
                verticalPolicy: "Formula"
                verticalFormula: "parent - 32"
            UIInputEventComponent:
                onTouchUpInside: ""
                onTouchUpInsideData: "false"
        bindings:
        - ["input", "closeByTap and backEnabled"]
    -   class: "UIControl"
        name: "DialogContent"
        position: [480.000000, 320.000000]
        pivot: [0.500000, 0.500000]
        classes: "black-50-bg"
        components:
            Background:
                drawType: "DRAW_STRETCH_BOTH"
                sprite: "~res:/Gfx/Lobby/backgrounds/bg_r16.psd"
                leftRightStretchCap: 16.000000
                topBottomStretchCap: 16.000000
            UIOpacityComponent: {}
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            LinearLayout:
                orientation: "TopDown"
            SizePolicy:
                horizontalPolicy: "FixedSize"
                horizontalValue: 650.000000
                verticalPolicy: "Formula"
                verticalFormula: "when parent == 0 -> childrenSum,min(childrenSum, parent-80)"
            StyleSheet:
                styles: "~res:/UI/Screens3/Color.style.yaml"
        children:
        -   class: "UIControl"
            name: "Header"
            input: false
            components:
                LinearLayout:
                    orientation: "TopDown"
                    padding: "24"
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfMaxChild"
            children:
            -   class: "UIControl"
                name: "Value"
                position: [300.000000, 24.000000]
                size: [300.000000, 100.000000]
                input: false
                classes: "t-subtitle regular white-wild-sand-text"
                components:
                    UITextComponent:
                        colorInheritType: "COLOR_IGNORE_PARENT"
                        multiline: "MULTILINE_ENABLED"
                    Anchor:
                        hCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 400.000000
                        horizontalFormula: "min(parent - 48, content)"
                        verticalPolicy: "PercentOfContent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Color.style.yaml;~res:/UI/Screens3/Font.style.yaml"
                bindings:
                - ["UITextComponent.text", "localize(header)"]
        -   class: "UIControl"
            name: "SeparatorTop"
            input: false
            classes: "white-wild-sand-10-bg"
            components:
                UIOpacityComponent: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "FixedSize"
                    verticalValue: 1.000000
                StyleSheet:
                    styles: "~res:/UI/Screens3/Color.style.yaml"
        -   class: "UIControl"
            name: "Content1"
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                LinearLayout:
                    orientation: "TopDown"
                SizePolicy:
                    horizontalPolicy: "Formula"
                    horizontalFormula: "parent - 48"
                    verticalPolicy: "PercentOfChildrenSum"
                UIChildComponent0:
                    childType: "kControl"
                    control: "contentControl1"
        -   class: "UIControl"
            name: "SeparatorTop"
            input: false
            classes: "white-wild-sand-10-bg"
            components:
                UIOpacityComponent: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "FixedSize"
                    verticalValue: 30.000000
                StyleSheet:
                    styles: "~res:/UI/Screens3/Color.style.yaml"
        -   class: "UIControl"
            name: "Content1_2"
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                LinearLayout:
                    orientation: "TopDown"
                SizePolicy:
                    horizontalPolicy: "Formula"
                    horizontalFormula: "parent - 48"
                    verticalPolicy: "PercentOfChildrenSum"
                UIChildComponent0:
                    childType: "kControl"
                    condition: "not isExpire"
                    control: "contentControl2"
        -   class: "UIControl"
            name: "Footer"
            position: [0.000000, 120.000000]
            size: [650.000000, 96.000000]
            input: false
            components:
                LinearLayout:
                    orientation: "LeftToRight"
                    padding: "50"
                    spacing: 30.000000
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "FixedSize"
                    verticalValue: 96.000000
            children:
            -   class: "UIControl"
                name: "OptionalButtonContainer"
                input: false
                components:
                    Anchor:
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        horizontalValue: 80.000000
                        verticalPolicy: "PercentOfFirstChild"
                bindings:
                - ["visible", "true"]
                children:
                -   prototype: "Button/Button"
                    name: "ButtonOptionalLight"
                    components:
                        Anchor:
                            vCenterAnchorEnabled: true
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                        UIDataParamsComponent:
                            args:
                                "locked": "false"
                                "caption": "optionalButtonText"
                                "type": "optionalButtonType"
                                "size": "eButtonSize.NORMAL"
                                "sound": "eButtonSound.CANCEL"
                                "enabled": "true"
                                "iconPath": "when isGamepad -> \"~res:/Gfx/Shared/icons/nintendo-switch/icon_switch_b_m\", \"\""
                            eventActions:
                            - ["ON_CLICK_BUTTON", "OPTIONAL_CLICKED", ""]
                        UIIdentifierComponent:
                            id: "button_optional"
            -   class: "UIControl"
                name: "ButtonAccept"
                position: [342.000000, 24.000000]
                input: false
                components:
                    Anchor:
                        hCenterAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        horizontalValue: 80.000000
                        verticalPolicy: "PercentOfMaxChild"
                children:
                -   prototype: "Button/Button"
                    name: "Button"
                    visible: true
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                        UIDataParamsComponent:
                            args:
                                "caption": "accentButtonText"
                                "iconPath": "when isGamepad -> \"~res:/Gfx/Lobby/icons/nintendo-switch/icon_switch_y_m\", \"\""
                                "size": "eButtonSize.NORMAL"
                                "sound": "eButtonSound.UNKNOWN"
                                "type": "accentButtonType"
                            eventActions:
                            - ["ON_CLICK_BUTTON", "APPLY", ""]
