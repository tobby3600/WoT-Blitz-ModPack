Header:
    version: 161
Prototypes:
-   class: "UIControl"
    name: "KeyArt"
    input: false
    components:
        Anchor:
            leftAnchorEnabled: true
            rightAnchorEnabled: true
            topAnchorEnabled: true
            bottomAnchorEnabled: true
        UIDataParamsComponent:
            params:
            - ["eScreenSizeType", "deviceType", "eScreenSizeType.Medium", "eScreenSizeType.Medium"]
        UIDataLocalVarsComponent:
            data:
            - ["eResourceLoadingStrategy", "spriteResource", "when deviceType == eScreenSizeType.Large -> eResourceLoadingStrategy.PreferMaxResolution, eResourceLoadingStrategy.PreferDesired"]
    children:
    -   class: "UIControl"
        name: "Holder"
        size: [1364.000000, 768.000000]
        pivot: [0.500000, 0.500000]
        input: false
        components:
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            ScalePolicy:
                horizontalFormula: "max(parentSize.X / size.X, parentSize.Y / size.Y)"
                verticalFormula: "max(parentSize.X / size.X, parentSize.Y / size.Y)"
        children:
        -   class: "UIControl"
            name: "sprite"
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                    vCenterAnchorEnabled: true
                Background:
                    drawType: "DRAW_SCALE_TO_RECT"
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
            bindings:
            - ["Background.spriteResource", "spriteResource"]
            - ["Background.sprite", "\"~res:/Gfx/UI/KeyArt/keyart\""]
    -   class: "UIControl"
        name: "FadesWrapper"
        input: false
        components:
            Anchor:
                hCenterAnchorEnabled: true
                vCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
        children:
        -   class: "UIControl"
            name: "TopFade"
            input: false
            classes: "black-35-bg"
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                    topAnchorEnabled: true
                IgnoreLayout: {}
                Background:
                    drawType: "DRAW_SCALE_TO_RECT"
                    sprite: "~res:/Gfx/Lobby/backgrounds/bg_gradient_vertical_0-100"
                    spriteModification: ["FLIP_VERTICAL"]
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
                    verticalValue: 47.500000
                StyleSheet:
                    styles: "~res:/UI/Screens3/Color.style.yaml"
        -   class: "UIControl"
            name: "BottomFade"
            input: false
            classes: "black-35-bg"
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                    bottomAnchorEnabled: true
                Background:
                    drawType: "DRAW_STRETCH_BOTH"
                    sprite: "~res:/Gfx/Lobby/backgrounds/bg_gradient_vertical_0-100"
                IgnoreLayout: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
                    verticalValue: 47.500000
                StyleSheet:
                    styles: "~res:/UI/Screens3/Color.style.yaml"
