            - ["bool", "isBlurMask", "true", "true"]
            - ["bool", "isDualMask", "false", "false"]
            - ["bool", "isSpecificSRC", "false", "false"]
            - ["string", "ID", "\"\"", "\"\""]
            - ["string", "roundCorner", "\"\"", "\"\""]
        UIDataLocalBindingsComponent:
