Header:
    version: 161
ImportedPackages:
- "~res:/UI/Screens3/Common/HorizontalScrollBar.yaml"
Prototypes:
-   class: "UIControl"
    name: "2025-BPLIKE"
    size: [960.000000, 448.000000]
    input: false
    components:
        UIAnimationComponent:
            animations: "_INIT,~res:/UI/Screens3/Lobby/Story/2025-BPLIKE/2025-BPLIKETreeOnInit.animation"
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfParent"
        UILayoutEventComponent:
            sizeChangedEvent: "SCREEN_SIZE_CHANGED"
            sizeChangedEventData: "_size"
        UIDataParamsComponent:
            params:
            - ["AppDataModel", "app", "null", "{ }"]
            - ["SessionDataModel", "session", "null", "{ }"]
            - ["StoryScreenViewModel", "viewModel", "null", "{ \"selectedStory\" = { \"name\" = \"2025-BPLIKE\"; \"resources\" = { \"graphics\" = { \"background_parallax_1\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/bg_1.webp\"; \"background_parallax_2\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/bg_2.webp\"; \"background_parallax_3\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/bg_3.webp\"; \"background_front\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/bg-halloween-2023-front.webp\"; \"step_image_100\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/bandle1@2x.webp\"; \"step_image_101\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/bandle2@2x.webp\"; \"step_image_200\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/offer1@2x.webp\"; \"step_image_201\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/offer2@2x.webp\"; \"button\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/button.png\"; \"logo\" = \"http://smartdlc.wgtest.net/assets/Gfx/Lobby/events/2023-HALLOWEEN/logo-button@2x.webp\"; }; }; }; }"]
            events:
            - "PARALLAX_SHIFT(float shift)"
            - "DESELECT"
            - "SHOW_STEP_INFO(int id)"
            - "SELECT_STEP(int id)"
        UIDataLocalVarsComponent:
            data:
            - ["float", "bgScale", "max(screenWidth / 1024.000000, screenHeight / 512.000000)"]
            - ["vector2", "stepSize", "vec2(120.000000, 176.000000)"]
            - ["int", "paidPassId", "100"]
            - ["string", "paidPassGroupName", "\"shopBundle\""]
            - ["string", "boostersGroupName", "\"instantBoosters\""]
            - ["vector2", "scrollSize", "vec2(stepSize.X * viewModel.treeViewModel.groups[\"common\"].steps.Size(), stepSize.Y)"]
            - ["float", "scrollShift", "0.000000"]
            - ["bool", "isInited", "false"]
            - ["int", "initialLevelNumber", "0"]
        UIDataLocalBindingsComponent:
            data:
            - ["eScreenSizeType", "deviceType", "app.constants.deviceType"]
            - ["StoryResources", "resources", "viewModel.selectedStory.resources"]
            - ["StoryStepModel", "inProgressStep", "when not isNull(viewModel.treeViewModel) -> viewModel.treeViewModel.tree.inProgressStep, null"]
            - ["ResourceDetailed", "progressPrice", "when not isNull(inProgressStep) and not inProgressStep.price.Empty() -> inProgressStep.price[0], null"]
            - ["int", "levelsCount", "viewModel.treeViewModel.groups[\"common\"].steps.Size()"]
            - ["int", "levelNumber", "min(levelsCount, (when not isNull(inProgressStep) -> inProgressStep.id, not isNull(viewModel.treeViewModel) -> levelsCount, levelsCount))"]
            - ["int", "progressTotal", "when not isNull(progressPrice) and not isNull(progressPrice.stuff) -> progressPrice.stuff.quantity, 0"]
            - ["int", "progressLeft", "when not isNull(progressPrice) and not isNull(progressPrice.stuff) and inProgressStep.net.price.Contains(progressPrice.stuff.name) -> inProgressStep.net.price[progressPrice.stuff.name].stuff.quantity, 0"]
            - ["int", "progressCurrent", "progressTotal - progressLeft"]
            - ["string", "progressIcon", "viewModel.selectedStory.resources.graphics[\"logo\"]"]
            - ["StoryStepGroupViewModel", "paidPassGroup", "when not isNull(viewModel.treeViewModel) and viewModel.treeViewModel.groups.Contains(paidPassGroupName) -> viewModel.treeViewModel.groups[paidPassGroupName], null"]
            - ["StoryStepGroupViewModel", "boostersGroup", "when not isNull(viewModel.treeViewModel) and viewModel.treeViewModel.groups.Contains(boostersGroupName) -> viewModel.treeViewModel.groups[boostersGroupName], null"]
        UIActionComponent:
            actionsPath: "~res:/UI/Screens3/Lobby/Story/2025-BPLIKE/2025-BPLIKETree.actions"
        UIEventOnDataComponent0:
            watchedDataExpression: "levelNumber"
            ifExpression: "isInited and levelNumber != initialLevelNumber"
            eventName: "SCROLL_TO_NEW_PROGRESS_STEP"
    children:
    -   class: "UIControl"
        name: "BgLayer"
        input: false
        components:
            Anchor:
                topAnchorEnabled: true
                topAnchor: -48.000000
                bottomAnchorEnabled: true
                bottomAnchor: -105.000000
            SizePolicy:
                horizontalPolicy: "Formula"
                horizontalFormula: "screenWidth"
                verticalPolicy: "Formula"
                verticalFormula: "screenHeight"
        children:
        -   class: "UIScrollView"
            name: "BgScrollView"
            autoUpdate: true
            components:
                ClipContent:
                    top: false
                    bottom: false
                Anchor:
                    bottomAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
            children:
            -   class: "UIScrollViewContainer"
                name: "scrollContainerControl"
                input: false
                refreshStylesOnInteract: false
                scrollDirection: "kHorizontal"
                components:
                    SizePolicy:
                        horizontalPolicy: "PercentOfFirstChild"
                        verticalPolicy: "PercentOfFirstChild"
                children:
                -   class: "UIControl"
                    name: "ParallaxBg"
                    input: false
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfFirstChild"
                            verticalPolicy: "PercentOfFirstChild"
                    children:
                    -   class: "UIControl"
                        name: "Back"
                        input: false
                        components:
                            LinearLayout: {}
                            SizePolicy:
                                horizontalPolicy: "PercentOfChildrenSum"
                                verticalPolicy: "PercentOfMaxChild"
                        children:
                        -   class: "UIControl"
                            name: "Image1"
                            input: false
                            components:
                                Background:
                                    drawType: "DRAW_SCALE_TO_RECT"
                                    spriteResource: "PreferMaxResolution"
                                    perPixelAccuracy: "PER_PIXEL_ACCURACY_ENABLED"
                                UIUrlImageComponent:
                                    checkUpdate: true
                                SizePolicy:
                                    horizontalPolicy: "FixedSize"
                                    verticalPolicy: "FixedSize"
                            bindings:
                            - ["UIUrlImageComponent.imageUrl", "resources.graphics[\"background_parallax_1\"]"]
                            - ["SizePolicy.horizontalValue", "1024.000000 * bgScale"]
                            - ["SizePolicy.verticalValue", "512.000000 * bgScale"]
    -   class: "UIControl"
        name: "FxLayer"
        input: false
        components:
            Anchor:
                topAnchorEnabled: true
            IgnoreLayout: {}
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
        children:
        -   class: "UIParticles"
            name: "Fx"
            pivot: [0.500000, 0.500000]
            visible: false
            input: false
            effectPath: "~res:/3d/FX/UI/Halloween2020/EnvFx.sc2"
            autoStart: true
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                    vCenterAnchorEnabled: true
                    vCenterAnchor: 120.000000
                IgnoreLayout: {}
    -   class: "UIControl"
        name: "ContentLayer"
        input: false
        components:
            LinearLayout:
                orientation: "TopDown"
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
        children:
        -   class: "UIControl"
            name: "Buttons"
            components:
                LinearLayout:
                    orientation: "TopDown"
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
                UIInputEventComponent:
                    onTouchUpInside: "DESELECT"
                    blockDuplicatedEvents: true
            children:
            -   class: "UIControl"
                name: "Spacer"
                input: false
                components:
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        verticalPolicy: "Formula"
                        verticalFormula: "max(160,min(parentRest, parent * 0.45))"
            -   class: "UIControl"
                name: "Content"
                input: false
                components:
                    Anchor:
                        hCenterAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfFirstChild"
                        verticalPolicy: "Ignore"
                    UIChildComponent0:
                        childType: "kControl"
                        control: "Buttons"
        -   class: "UIControl"
            name: "StepsSafeArea"
            input: false
            components:
                Anchor:
                    bottomAnchorEnabled: true
                LinearLayout: {}
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfMaxChild"
            children:
            -   class: "UIControl"
                name: "LeftSafeAreaSpacer"
                input: false
                components:
                    SizePolicy:
                        horizontalPolicy: "Formula"
                        horizontalFormula: "when safeAreaInsets.left == 0 -> 16, safeAreaInsets.left"
                        verticalPolicy: "PercentOfParent"
            -   class: "UIControl"
                name: "StepsScrollArea"
                input: false
                components:
                    Anchor:
                        bottomAnchorEnabled: true
                    LinearLayout:
                        orientation: "TopDown"
                        spacing: 4.000000
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        verticalPolicy: "PercentOfChildrenSum"
                    UILayoutEventComponent:
                        sizeChangedEvent: "StepsAreaChanged"
                        sizeChangedEventData: "_size"
                children:
                -   class: "UIScrollView"
                    name: "ScrollView"
                    autoUpdate: true
                    centerContent: true
                    components:
                        ClipContent:
                            enabled: false
                        Anchor:
                            bottomAnchorEnabled: true
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfMaxChild"
                    children:
                    -   class: "UIScrollViewContainer"
                        name: "scrollContainerControl"
                        refreshStylesOnInteract: false
                        scrollDirection: "kHorizontal"
                        components:
                            LinearLayout:
                                orientation: "TopDown"
                            SizePolicy:
                                horizontalPolicy: "PercentOfLastChild"
                                verticalPolicy: "PercentOfChildrenSum"
                            UILayoutEventComponent:
                                positionChangedEvent: "SCROLL_POSITION_CHANGED"
                                positionChangedEventData: "_position"
                                sizeChangedEvent: "SCROLL_SIZE_CHANGED"
                                sizeChangedEventData: "_size"
                        children:
                        -   class: "UIControl"
                            name: "Spacer"
                            input: false
                            components:
                                SizePolicy:
                                    horizontalPolicy: "PercentOfParent"
                                    verticalPolicy: "FixedSize"
                                    verticalValue: 40.000000
                        -   class: "UIControl"
                            name: "Steps"
                            input: false
                            components:
                                Background:
                                    usePostProcessedSprite: true
                                UIPostProcessTextureComponent0:
                                    materialPath: "~res:/Materials.custom/2d.Textured.Blur.material"
                                    needClearAlphaAfterRender: true
                                    scale: 0.250000
                                    useVirtualCoordinateSystem: true
                                    minFilter: "Linear"
                                    magFilter: "Linear"
                                UIPostProcessTextureComponent1:
                                    materialPath: "~res:/Materials.custom/2d.Textured.HBlur.material"
                                    scale: 0.250000
                                    useVirtualCoordinateSystem: true
                                    minFilter: "Linear"
                                    magFilter: "Linear"
                                UIPostProcessTextureComponent2:
                                    materialPath: "~res:/Materials.custom/2d.Textured.UpscaleClamp.material"
                                    scale: 0.250000
                                    useVirtualCoordinateSystem: true
                                    minFilter: "Linear"
                                    magFilter: "Linear"
                                SizePolicy:
                                    horizontalPolicy: "PercentOfLastChild"
                                    verticalPolicy: "PercentOfMaxChild"
                            children:
                            -   class: "UIControl"
                                name: "StepsHolder"
                                input: false
                                components:
                                    LinearLayout: {}
                                    SizePolicy:
                                        horizontalPolicy: "FixedSize"
                                        verticalPolicy: "FixedSize"
                                    UIRepeatComponent:
                                        control: "~res:/UI/Screens3/Lobby/Story/Components/LinearShort.yaml"
                                        dataContainer: "viewModel.treeViewModel.groups[\"common\"].steps"
                                        args:
                                            "isBundleObtained": "paidPassGroup.steps[100].shopBundleStep.isObtained or paidPassGroup.steps[101].shopBundleStep.isObtained"
                                            "model": "_item"
                                            "inProgressStep": "viewModel.treeViewModel.tree.inProgressStep"
                                            "maximumProgress": "1.000000"
                                        eventActions:
                                        - ["SELECT_STEP", "SCROLL_TO_STEP", "_event.id"]
                                        - ["SHOW_STEP_INFO", "SHOW_STEP_INFO", "_event.id"]
                                        elementNameExpression: "\"Step\" + str(_item.step.id)"
                                bindings:
                                - ["SizePolicy.horizontalValue", "scrollSize.X"]
                                - ["SizePolicy.verticalValue", "scrollSize.Y"]
                -   prototype: "HorizontalScrollBar/HorizontalScrollBar"
                    name: "HorizontalScrollBar"
                    visible: true
                    components:
                        UIScrollBarComponent:
                            delegate: "../ScrollView"
            -   class: "UIControl"
                name: "RightSafeAreaSpacer"
                input: false
                components:
                    SizePolicy:
                        horizontalPolicy: "Formula"
                        horizontalFormula: "when safeAreaInsets.right == 0 -> 16, safeAreaInsets.right"
                        verticalPolicy: "PercentOfParent"
Slots:
-   class: "UIControl"
    name: "Buttons"
    input: false
    components:
        Anchor:
            vCenterAnchorEnabled: true
        LinearLayout:
            spacing: 32.000000
        SizePolicy:
            horizontalPolicy: "PercentOfChildrenSum"
            verticalPolicy: "PercentOfMaxChild"
    children:
    -   class: "UIControl"
        name: "ProgressInfo"
        input: false
        components:
            Anchor:
                hCenterAnchorEnabled: true
            LinearLayout:
                orientation: "TopDown"
                spacing: 4.000000
                skipInvisible: false
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfChildrenSum"
        children:
        -   class: "UIControl"
            name: "ImageWrapper"
            pivot: [0.500000, 0.500000]
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                    vCenterAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "PercentOfFirstChild"
                    verticalPolicy: "PercentOfFirstChild"
            children:
            -   class: "UIControl"
                name: "Image"
                input: false
                components:
                    Background:
                        drawType: "DRAW_SCALE_TO_RECT"
                        spriteResource: "PreferMaxResolution"
                    UIUrlImageComponent: {}
                    SizePolicy:
                        horizontalPolicy: "FixedSize"
                        horizontalValue: 105.000000
                        verticalPolicy: "FixedSize"
                        verticalValue: 105.000000
                bindings:
                - ["UIUrlImageComponent.imageUrl", "progressIcon"]
            -   class: "UIControl"
                name: "LevelWrapper"
                input: false
                components:
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        verticalPolicy: "PercentOfParent"
                children:
                -   class: "UIControl"
                    name: "Level"
                    input: false
                    classes: "t-content-h4 bold not-localize white-wild-sand-text"
                    components:
                        UITextComponent: {}
                        Anchor:
                            hCenterAnchorEnabled: true
                            topAnchorEnabled: true
                            topAnchor: 63.000000
                        SizePolicy:
                            horizontalPolicy: "PercentOfContent"
                            verticalPolicy: "PercentOfContent"
                        StyleSheet:
                            styles: "~res:/UI/Screens3/Font.style.yaml"
                    bindings:
                    - ["UITextComponent.text", "when levelNumber > 60 -> \"\", levelNumber"]
        -   class: "UIControl"
            name: "LevelDescription"
            input: false
            classes: "t-caption regular white-wild-sand-50-text"
            components:
                UITextComponent:
                    fitting: "FITTING_POINTS"
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfContent"
                StyleSheet:
                    styles: "~res:/UI/Screens3/Font.style.yaml"
            bindings:
            - ["UITextComponent.text", "when levelNumber > 60 -> localize(\"2023-HALLOWEEN/Shield/ChestDescription\"), (localize(\"2023-HALLOWEEN/Shield/LevelDescription\", { \"value\" = levelNumber; }))"]
        -   class: "UIControl"
            name: "ProgressBarWrapper"
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "FixedSize"
                    horizontalValue: 140.000000
                    verticalPolicy: "Formula"
                    verticalFormula: "lastChild + 4"
            bindings:
            - ["visible", "progressTotal > 0"]
            children:
            -   class: "UIControl"
                name: "Bg"
                input: false
                classes: "black-70-bg"
                components:
                    Background: {}
                    UIRoundedCornersComponent:
                        radius: "2"
                    LinearLayout:
                        padding: "8"
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        verticalPolicy: "PercentOfParent"
                    StyleSheet:
                        styles: "~res:/UI/Screens3/Color.style.yaml"
            -   class: "UIControl"
                name: "ProgressBarHolder"
                input: false
                components:
                    Anchor:
                        hCenterAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "Formula"
                        horizontalFormula: "parent - 4"
                        verticalPolicy: "FixedSize"
                        verticalValue: 4.000000
                    UIChildComponent0:
                        prototypePath: "~res:/UI/Screens3/Lobby/Common/ProgressBar.yaml"
                        args:
                            "minimum": "0"
                            "maximum": "progressTotal"
                            "value": "progressCurrent"
                            "progressColor": "\"yellow-chalky-bg\""
                            "roundCorners": "true"
                            "showGradient": "false"
        -   class: "UIControl"
            name: "Spacer"
            input: false
            components:
                SizePolicy:
                    horizontalPolicy: "FixedSize"
                    verticalPolicy: "FixedSize"
                    verticalValue: 4.000000
        -   class: "UIControl"
            name: "Price"
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "PercentOfFirstChild"
                    verticalPolicy: "Formula"
                    verticalFormula: "max(firstChild, 20)"
                UIChildComponent0:
                    prototypePath: "~res:/UI/Screens3/Lobby/Common/Resource/CurrencyAdapter.yaml"
                    args:
                        "currencySize": "eCurrencySize.BODY"
                        "canAfford": "true"
                        "forceFullValue": "true"
                        "resource": "progressPrice"
    -   class: "UIControl"
        name: "Spacer"
        input: false
        components:
            SizePolicy:
                horizontalPolicy: "FixedSize"
                horizontalValue: 0.000000
                verticalPolicy: "FixedSize"
    -   class: "UIControl"
        name: "Bundle1"
        input: false
        components:
            Anchor: {}
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfFirstChild"
            UIChildComponent0:
                prototypePath: "~res:/UI/Screens3/Lobby/Story/2025-BPLIKE/BundleButton.yaml"
                args:
                    "placeHolder1": "viewModel.selectedStory.stage.proxies[resources.strings[\"richtextPlaceholders.proxy3\"]]"
                    "name": "resources.strings.bundleTitle"
                    "reward1": "localize(\"event/Bundle/unlockStage/hint\")"
                    "reward2": "localize(\"2023-HALLOWEEN/Bundle/Tasks\")"
                    "image": "resources.graphics[\"step_image_100\"]"
                    "isSelected": "paidPassGroup.steps[100].isSelected"
                    "price": "paidPassGroup.steps[100].shopBundleStep.price"
                eventActions:
                - ["ON_TOUCH", "SHOW_CHEST_INFO", "100"]
        bindings:
        - ["visible", "not paidPassGroup.steps[100].shopBundleStep.isObtained"]
    -   class: "UIControl"
        name: "Bundle2"
        input: false
        components:
            Anchor: {}
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfFirstChild"
            UIChildComponent0:
                prototypePath: "~res:/UI/Screens3/Lobby/Story/2025-BPLIKE/BundleButton.yaml"
                args:
                    "placeHolder1": "viewModel.selectedStory.stage.proxies[resources.strings[\"richtextPlaceholders.proxy3\"]]"
                    "name": "resources.strings.extendedBundleTitle"
                    "reward1": "localize(\"event/Bundle/unlockStage/hint\")"
                    "reward2": "localize(\"2024-HALLOWEEN/ExtendedBundle/Levels\")"
                    "reward3": "localize(\"2025-BPLIKE-AUGUST/ExtendedBundle/Boosters\")"
                    "reward4": "localize(\"2025-BPLIKE/Bundle/bonusChest/hint\")"
                    "image": "resources.graphics[\"step_image_101\"]"
                    "isSelected": "paidPassGroup.steps[101].isSelected"
                    "price": "paidPassGroup.steps[101].shopBundleStep.price"
                eventActions:
                - ["ON_TOUCH", "SHOW_CHEST_INFO", "101"]
        bindings:
        - ["visible", "not paidPassGroup.steps[101].shopBundleStep.isObtained"]
    -   class: "UIControl"
        name: "Booster1"
        input: false
        components:
            Anchor:
                hCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfFirstChild"
            UIChildComponent0:
                prototypePath: "~res:/UI/Screens3/Lobby/Story/2025-BPLIKE/BoosterButton.yaml"
                args:
                    "levelValue": "1"
                    "levelDescription": "localize(\"2023-HALLOWEEN/Booster/UnlockedLevel\")"
                    "price": "boostersGroup.steps[200].step.price[0UL]"
                    "image": "resources.graphics[\"step_image_200\"]"
                    "isSelected": "boostersGroup.steps[200].isSelected"
                eventActions:
                - ["ON_TOUCH", "SELECT_STEP", "200"]
        bindings:
        - ["visible", "paidPassGroup.steps[100].shopBundleStep.isObtained or paidPassGroup.steps[101].shopBundleStep.isObtained"]
    -   class: "UIControl"
        name: "Booster2"
        input: false
        components:
            Anchor:
                hCenterAnchorEnabled: true
            SizePolicy:
                horizontalPolicy: "PercentOfFirstChild"
                verticalPolicy: "PercentOfFirstChild"
            UIChildComponent0:
                prototypePath: "~res:/UI/Screens3/Lobby/Story/2025-BPLIKE/BoosterButton.yaml"
                args:
                    "levelValue": "5"
                    "levelDescription": "localize(\"2023-HALLOWEEN/ExtendedBooster/UnlockedLevels\")"
                    "price": "boostersGroup.steps[201].step.price[0UL]"
                    "image": "resources.graphics[\"step_image_201\"]"
                    "isSelected": "boostersGroup.steps[201].isSelected"
                eventActions:
                - ["ON_TOUCH", "SELECT_STEP", "201"]
        bindings:
        - ["visible", "paidPassGroup.steps[100].shopBundleStep.isObtained or paidPassGroup.steps[101].shopBundleStep.isObtained"]
