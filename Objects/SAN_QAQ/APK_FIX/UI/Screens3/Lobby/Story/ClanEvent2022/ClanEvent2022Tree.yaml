Header:
    version: 161
Prototypes:
-   class: "UIControl"
    name: "ClanEvent2022Tree"
    size: [1200.000000, 1000.000000]
    input: false
    components:
        Anchor:
            hCenterAnchorEnabled: true
            vCenterAnchorEnabled: true
        LinearLayout: {}
        SizePolicy:
            horizontalPolicy: "PercentOfParent"
            verticalPolicy: "PercentOfParent"
        UIDataParamsComponent:
            params:
            - ["vector2", "screenSize", "vec2(0.000000, 0.000000)", "vec2(1200.000000, 1128.000000)"]
            - ["vector2", "footerSize", "vec2(0.000000, 0.000000)", "vec2(1200.000000, 80.000000)"]
            - ["vector2", "contentSize", "vec2(0.000000, 0.000000)", "vec2(1200.000000, 1000.000000)"]
            - ["vector2", "headerSize", "vec2(0.000000, 0.000000)", "vec2(1200.000000, 48.000000)"]
            - ["StoryScreenViewModel", "viewModel", "null", "{ }"]
            - ["ResourceModel", "statsGold", "null", "{ }"]
            events:
            - "DESELECT"
            - "SHOW_STEP_INFO(int id)"
            - "SELECT_STEP(int id)"
        UIDataLocalVarsComponent:
            data:
            - ["vector2", "innerSize", "vec2(0.000000, 0.000000)"]
        UIDataLocalBindingsComponent:
            data:
            - ["StoryStepModel", "step", "when not isNull(viewModel.treeViewModel.selectedStep) -> viewModel.treeViewModel.selectedStep.step, viewModel.treeViewModel.groups[\"common\"].steps[1].step"]
            - ["string", "proxyName", "step.price[0].stuff.name"]
            - ["ResourceDetailed", "proxy", "viewModel.selectedStory.stage.proxies[proxyName]"]
            - ["int", "currentProgress", "proxy.stuff.quantity"]
            - ["int", "totalProgress", "step.price[0].stuff.quantity"]
            - ["float", "progressRatio", "when totalProgress != 0 -> currentProgress * 1.000000 / totalProgress, 0.000000"]
            - ["float", "offset", "when progressRatio < 0.050000 -> (0.050000 - progressRatio) * 100, progressRatio > 0.950000 -> (progressRatio - 0.950000) * -100, 0.000000"]
            - ["int", "imageH", "640"]
            - ["int", "imageW", "960"]
            - ["int", "imageWpo2", "1024"]
            - ["float", "imageProgressRatio", "when progressRatio < 0.000010 or progressRatio > 0.999990 -> progressRatio, screenSize.X * imageH < imageW * screenSize.Y -> (0.500000 + (progressRatio - 0.500000) * (innerSize.X * imageH) / (screenSize.Y * imageW)), (screenSize.X - innerSize.X) * 0.500000 / screenSize.X + progressRatio * innerSize.X / screenSize.X"]
        UIDataOnEventComponent0:
            eventName: "InnerSizeChanged"
            modelFieldExpression: "innerSize"
            dataExpression: "_event"
    children:
    -   class: "UIControl"
        name: "LeftNotch"
        input: false
        components:
            SizePolicy:
                horizontalPolicy: "Formula"
                horizontalFormula: "safeAreaInsets.left"
                verticalPolicy: "PercentOfParent"
    -   class: "UIControl"
        name: "Content"
        size: [32.000000, 32.000000]
        input: false
        components:
            SizePolicy:
                horizontalPolicy: "PercentOfParent"
                verticalPolicy: "PercentOfParent"
            UILayoutEventComponent:
                sizeChangedEvent: "InnerSizeChanged"
                sizeChangedEventData: "_size"
        children:
        -   class: "UIControl"
            name: "BgWrapper"
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                    topAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "FixedSize"
                    verticalPolicy: "FixedSize"
            bindings:
            - ["Anchor.topAnchor", "-headerSize.Y"]
            - ["SizePolicy.horizontalValue", "screenSize.X"]
            - ["SizePolicy.verticalValue", "screenSize.Y"]
            children:
            -   class: "UIControl"
                name: "Bg"
                pivot: [0.500000, 0.500000]
                input: false
                components:
                    UITextureComponent:
                        spritePath: "~res:/Gfx/Lobby/events/2022-clan-event/tank-image"
                        materialPath: "~res:/Materials.custom/2d.Textured.HSV.material"
                        drawType: "DRAW_SCALE_TO_RECT"
                        perPixelAccuracy: "PER_PIXEL_ACCURACY_FORCED"
                    Anchor:
                        hCenterAnchorEnabled: true
                        vCenterAnchorEnabled: true
                    SizePolicy:
                        horizontalPolicy: "PercentOfContent"
                        verticalPolicy: "PercentOfContent"
                    ScalePolicy:
                        horizontalFormula: "max(parentSize.X / size.X, parentSize.Y / size.Y)"
                        verticalFormula: "max(parentSize.X / size.X, parentSize.Y / size.Y)"
                bindings:
                - ["UITextureComponent.materialParams", "\"progress,\" + str(imageProgressRatio * imageW / imageWpo2) + \"; hue,0; saturation,-100; value,-70\""]
        -   class: "UIControl"
            name: "Info"
            input: false
            components:
                Anchor:
                    hCenterAnchorEnabled: true
                    vCenterAnchorEnabled: true
                SizePolicy:
                    horizontalPolicy: "PercentOfParent"
                    verticalPolicy: "PercentOfParent"
            children:
            -   class: "UIControl"
                name: "ProgressBar"
                size: [32.000000, 32.000000]
                input: false
                components:
                    Anchor:
                        hCenterAnchorEnabled: true
                        bottomAnchorEnabled: true
                        bottomAnchor: 160.000000
                    SizePolicy:
                        horizontalPolicy: "PercentOfParent"
                        horizontalValue: 95.000000
                        verticalPolicy: "FixedSize"
                        verticalValue: 4.000000
                bindings:
                - ["visible", "currentProgress < totalProgress"]
                children:
                -   class: "UIControl"
                    name: "ProgressBar"
                    input: false
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "FixedSize"
                            verticalValue: 4.000000
                        UIChildComponent0:
                            prototypePath: "~res:/UI/Screens3/Lobby/Common/ProgressBar.yaml"
                            args:
                                "maximum": "totalProgress"
                                "value": "min(currentProgress, totalProgress)"
                -   class: "UIControl"
                    name: "CurrentProgressIndicator"
                    size: [32.000000, 32.000000]
                    input: false
                    components:
                        SizePolicy:
                            horizontalPolicy: "PercentOfParent"
                            verticalPolicy: "PercentOfParent"
                            verticalValue: 80.000000
                    bindings:
                    - ["SizePolicy.horizontalValue", "progressRatio * 100.000000"]
                    children:
                    -   class: "UIControl"
                        name: "ProgressWrapper"
                        input: false
                        components:
                            Anchor:
                                rightAnchorEnabled: true
                                bottomAnchorEnabled: true
                                bottomAnchor: -40.000000
                            LinearLayout:
                                orientation: "TopDown"
                            SizePolicy:
                                horizontalPolicy: "Ignore"
                                verticalPolicy: "PercentOfChildrenSum"
                        children:
                        -   class: "UIControl"
                            name: "ArrowWrapper"
                            size: [32.000000, 32.000000]
                            input: false
                            components:
                                Anchor:
                                    hCenterAnchorEnabled: true
                                SizePolicy:
                                    horizontalPolicy: "FixedSize"
                                    horizontalValue: 12.000000
                                    verticalPolicy: "FixedSize"
                                    verticalValue: 12.000000
                            bindings:
                            - ["Anchor.hCenterAnchor", "offset"]
                            children:
                            -   class: "UIControl"
                                name: "Arrow"
                                input: false
                                classes: "white-wild-sand-15-bg"
                                components:
                                    Background:
                                        drawType: "DRAW_SCALE_PROPORTIONAL"
                                        sprite: "~res:/Gfx/UI/TaskJournal/Basic/ArrowControl.psd"
                                    Anchor:
                                        hCenterAnchorEnabled: true
                                        vCenterAnchorEnabled: true
                                    SizePolicy:
                                        horizontalPolicy: "FixedSize"
                                        horizontalValue: 16.000000
                                        verticalPolicy: "FixedSize"
                                        verticalValue: 16.000000
                                    StyleSheet:
                                        styles: "~res:/UI/Screens3/Color.style.yaml"
                        -   class: "UIControl"
                            name: "CurrencyAdapter"
                            pivot: [0.500000, 0.500000]
                            input: false
                            components:
                                Anchor:
                                    hCenterAnchorEnabled: true
                                    vCenterAnchorEnabled: true
                                UIOpacityComponent: {}
                                SizePolicy:
                                    horizontalPolicy: "Formula"
                                    horizontalFormula: "maxChild + 8"
                                    verticalPolicy: "Formula"
                                    verticalFormula: "maxChild + 4"
                                UIChildComponent0:
                                    prototypePath: "~res:/UI/Screens3/Lobby/Common/Resource/CurrencyAdapter.yaml"
                                    args:
                                        "forceFullValue": "true"
                                        "resource": "proxy"
                            bindings:
                            - ["Anchor.hCenterAnchor", "offset * 4"]
                            children:
                            -   prototype: "BlurModified/BlurModified"
                                name: "Blur"
                                components:
                                    UIDataParamsComponent:
                                        args:
                                            "bgStyle": "\"white-wild-sand-15-bg\""
                                            "roundCorner": "\"5\""
                -   class: "UIControl"
                    name: "Marks"
                    size: [32.000000, 32.000000]
                    input: false
                    components:
                        Anchor:
                            rightAnchorEnabled: true
                        SizePolicy:
                            horizontalPolicy: "Formula"
                            horizontalFormula: "parent - 2"
                            verticalPolicy: "FixedSize"
                            verticalValue: 4.000000
                        UIRepeatComponent:
                            control: "~res:/UI/Screens3/Lobby/Common/ProgressCheckmarkWithValue.yaml"
                            dataContainer: "[ totalProgress * 0; totalProgress * 0.250000; totalProgress * 0.500000; totalProgress * 0.750000; totalProgress * 1; ]"
                            args:
                                "xOffset": "when _index == 0 -> 12, _index == 4 -> -20, 0"
                                "maxValue": "totalProgress"
                                "value": "int(_item)"
            -   class: "UIControl"
                name: "ProgressAchievements"
                input: false
                components:
                    Anchor:
                        hCenterAnchorEnabled: true
                        bottomAnchorEnabled: true
                        bottomAnchor: 32.000000
                    LinearLayout:
                        spacing: 28.000000
                    SizePolicy:
                        horizontalPolicy: "PercentOfChildrenSum"
                        verticalPolicy: "PercentOfMaxChild"
                    UIRepeatComponent:
                        control: "~res:/UI/Screens3/Lobby/Story/ClanEvent2022/ClanEventAchievementProgress.yaml"
                        dataContainer: "viewModel.selectedStory.progressProxiesFromAchievements"
                        args:
                            "proxy": "proxy"
                            "model": "_item"
                        eventActions:
                        - ["SHOW_ACHIEVEMENT_INFO", "SHOW_ACHIEVEMENT_INFO", "_index"]
                bindings:
                - ["visible", "currentProgress < totalProgress"]
    -   class: "UIControl"
        name: "RightNotch"
        input: false
        components:
            SizePolicy:
                horizontalPolicy: "Formula"
                horizontalFormula: "safeAreaInsets.right"
                verticalPolicy: "PercentOfParent"
